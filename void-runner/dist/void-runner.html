<title>VOID RUNNER</title>
<style>
/*
 * VOID RUNNER — interface.
 *
 * Cible : téléphone en paysage, tenu à deux mains, pouces sur les bords.
 * Trois contraintes non négociables :
 *   - aucune commande sous une encoche ou une barre système (safe-area) ;
 *   - surface de frappe >= 64 px réels, même quand le visuel est plus petit ;
 *   - rien ne bouge quand on appuie ailleurs (pas de scroll, pas de zoom,
 *     pas de sélection, pas de menu contextuel).
 */

:root {
  --night: #0b0d20;
  --night2: #151a3a;
  --panel: rgba(12, 16, 40, 0.86);
  --cyan: #3fe8ff;
  --violet: #7b5cff;
  --white: #eaf6ff;
  --danger: #ff8a3d;
  --gold: #ffd166;
  --dim: rgba(234, 246, 255, 0.55);
  --line: rgba(123, 92, 255, 0.28);
  --safe-l: env(safe-area-inset-left, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  font-synthesis: none;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

/* Plusieurs conteneurs redéfinissent `display`, ce qui annule silencieusement
   l'attribut [hidden] — le bouton d'impulsion restait visible dès le niveau 1.
   Cette règle rend l'attribut fiable partout. */
[hidden] { display: none !important; }

html, body {
  height: 100%;
  overflow: hidden;
  background: #05060f;
  color: var(--white);
  font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
  -webkit-user-select: none;
  user-select: none;
  touch-action: none;
  overscroll-behavior: none;
}

#app { position: fixed; inset: 0; }

#game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

/* ---------------------------------------------------------------- ATH ---- */

#hud {
  position: absolute; top: 0; left: 0; right: 0;
  padding: calc(8px + var(--safe-t)) calc(12px + var(--safe-r)) 0 calc(12px + var(--safe-l));
  display: flex; justify-content: space-between; align-items: flex-start;
  pointer-events: none; font-variant-numeric: tabular-nums;
}
#hud .hud-left, #hud .hud-right { display: flex; gap: 10px; align-items: center; }
#hud .hud-right { flex-direction: column; align-items: flex-end; gap: 2px; }
.hud-level { font-size: 11px; letter-spacing: .08em; opacity: .8; line-height: 1.25; }
.hud-level span { display: block; }
#hud-num { font-weight: 700; color: var(--cyan); }
#hud-name { opacity: .65; }
.hud-attempt { font-size: 11px; letter-spacing: .12em; opacity: .7; }
.hud-attempt b { color: var(--gold); font-size: 13px; }
.hud-time { font-size: 15px; font-weight: 700; opacity: .5; }

.icon-btn {
  pointer-events: auto;
  width: 38px; height: 38px; border-radius: 12px;
  border: 1px solid var(--line); background: rgba(10, 14, 34, .55);
  color: var(--white); font-size: 13px; line-height: 1;
  display: grid; place-items: center; cursor: pointer;
  backdrop-filter: blur(6px);
}
.icon-btn:active { transform: scale(.94); }

/* ------------------------------------------------------- Commandes ------- */

#touch {
  position: absolute; inset: auto 0 0 0;
  padding: 0 calc(12px + var(--safe-r)) calc(8px + var(--safe-b)) calc(12px + var(--safe-l));
  display: flex; justify-content: space-between; align-items: flex-end;
  pointer-events: none;
}
.pad-group { display: flex; gap: 12px; align-items: flex-end; pointer-events: none; }

.pad {
  pointer-events: auto; position: relative;
  /* Petits VISUELLEMENT, grands AU TOUCHER (voir .pad::before). Mesuré sur un
     écran de 390 px de haut : au-delà de 68 px, le bouton de saut recouvre la
     ligne de sol — donc la sortie, donc le robot. */
  width: 56px; height: 56px; border-radius: 20px;
  border: 1px solid rgba(123, 92, 255, .35);
  background: rgba(20, 26, 60, .40);
  backdrop-filter: blur(8px);
  color: var(--white);
  display: grid; place-items: center;
  transition: transform .06s ease, background .1s ease;
  cursor: pointer;
}
/* Zone de frappe élargie de 16 px tout autour — invisible, décisive. */
.pad::before { content: ""; position: absolute; inset: -17px; }
.pad svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; opacity: .9; }
.pad.is-down { background: rgba(63, 232, 255, .26); transform: scale(.93); border-color: var(--cyan); }
.pad-jump { width: 68px; height: 68px; border-radius: 24px; background: rgba(63, 232, 255, .16); border-color: rgba(63, 232, 255, .4); }
.pad-dash { background: rgba(255, 209, 102, .14); border-color: rgba(255, 209, 102, .4); }
body.hand-left #touch { flex-direction: row-reverse; }

/* --------------------------------------------------------- Retours ------- */

#rotate {
  display: none;
  position: absolute; left: 50%; transform: translateX(-50%);
  top: calc(52px + var(--safe-t));
  white-space: nowrap;
  font-size: 10.5px; letter-spacing: .08em; color: var(--dim);
  background: rgba(10, 14, 34, .72); border: 1px solid var(--line);
  border-radius: 999px; padding: 6px 14px; backdrop-filter: blur(6px);
}
@media (orientation: portrait) { #rotate { display: block; } }

#flash { position: absolute; inset: 0; pointer-events: none; opacity: 0; background: #fff; }
#flash.on { animation: flash .18s ease-out; }
@keyframes flash { from { opacity: .5 } to { opacity: 0 } }

#deathband {
  position: absolute; left: 0; right: 0; top: 42%;
  text-align: center; pointer-events: none;
  font-size: 15px; letter-spacing: .1em; color: var(--white);
  text-shadow: 0 2px 18px rgba(0, 0, 0, .9);
  animation: rise .5s ease-out;
}
@keyframes rise { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }

#toast-wrap {
  position: absolute; top: calc(52px + var(--safe-t)); right: calc(12px + var(--safe-r));
  display: flex; flex-direction: column; gap: 8px; align-items: flex-end; pointer-events: none;
}
.toast {
  background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--gold);
  border-radius: 12px; padding: 8px 12px; min-width: 180px;
  backdrop-filter: blur(10px); animation: rise .3s ease-out;
}
.toast b { display: block; font-size: 12px; color: var(--gold); letter-spacing: .06em; }
.toast small { font-size: 10.5px; color: var(--dim); }

/* ---------------------------------------------------------- Écrans ------- */

.screen {
  position: absolute; inset: 0;
  background: radial-gradient(120% 100% at 50% 0%, #16193c 0%, #08091a 70%);
  display: flex; flex-direction: column;
  padding: calc(10px + var(--safe-t)) calc(16px + var(--safe-r)) calc(10px + var(--safe-b)) calc(16px + var(--safe-l));
  animation: fade .18s ease-out;
}
@keyframes fade { from { opacity: 0 } to { opacity: 1 } }
.screen[hidden] { display: none; }
.screen-overlay { background: rgba(5, 6, 15, .72); backdrop-filter: blur(8px); align-items: center; justify-content: center; }

.scr-head { display: flex; align-items: center; gap: 12px; padding-bottom: 8px; }
.scr-head h2 { font-size: 14px; letter-spacing: .22em; font-weight: 700; }
.scr-meta { margin-left: auto; font-size: 11px; color: var(--dim); letter-spacing: .06em; }

.scroll { flex: 1; overflow-y: auto; touch-action: pan-y; -webkit-overflow-scrolling: touch; padding: 4px 2px 16px; }

/* Menu principal */
[data-screen="menu"] { flex-direction: row; align-items: center; gap: 4%; justify-content: center; }
.menu-brand { text-align: center; }
#menu-robot { width: 128px; height: 128px; }
.menu-brand h1 { font-size: clamp(28px, 7vh, 46px); letter-spacing: .16em; line-height: .95; font-weight: 800; }
.menu-brand h1 span { display: block; color: var(--cyan); text-shadow: 0 0 24px rgba(63, 232, 255, .45); }
.tagline { margin-top: 10px; font-size: 10.5px; color: var(--dim); letter-spacing: .04em; max-width: 260px; }
.menu-nav { display: flex; flex-direction: column; gap: 9px; min-width: min(46vw, 300px); }

.btn {
  appearance: none; border: 1px solid var(--line); background: rgba(18, 22, 52, .7);
  color: var(--white); border-radius: 14px; padding: 13px 16px;
  font-size: 12.5px; letter-spacing: .16em; font-weight: 700; text-align: left;
  cursor: pointer; transition: transform .06s ease, border-color .12s ease, background .12s ease;
  min-height: 46px;
}
.btn:active { transform: scale(.98); background: rgba(28, 34, 76, .9); }
.btn:disabled { opacity: .35; }
.btn-primary { border-color: rgba(63, 232, 255, .55); background: linear-gradient(100deg, rgba(63, 232, 255, .22), rgba(123, 92, 255, .2)); }
.btn-primary b { display: block; font-size: 15px; letter-spacing: .18em; }
.btn-primary small { display: block; font-size: 10px; letter-spacing: .1em; color: var(--dim); font-weight: 600; margin-top: 2px; }

/* Sélection de niveaux */
.chapter-title { display: flex; align-items: baseline; gap: 10px; margin: 14px 2px 8px; }
.chapter-title h3 { font-size: 12px; letter-spacing: .18em; color: var(--violet); }
.chapter-title span { font-size: 10px; color: var(--dim); }
.lv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 8px; }
.lv {
  border: 1px solid var(--line); background: rgba(16, 20, 46, .75); border-radius: 12px;
  padding: 9px 10px; text-align: left; color: var(--white); cursor: pointer; min-height: 66px;
}
.lv:active { transform: scale(.98); }
.lv.locked { opacity: .32; }
.lv.done { border-color: rgba(63, 232, 255, .45); }
.lv-num { font-size: 15px; font-weight: 800; letter-spacing: .06em; }
.lv-num i { font-style: normal; color: var(--cyan); font-size: 11px; margin-left: 5px; }
.lv-name { font-size: 9.5px; color: var(--dim); margin: 2px 0 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lv-stat { font-size: 9.5px; color: var(--dim); font-variant-numeric: tabular-nums; display: flex; gap: 8px; }
.lv-stat b { color: var(--gold); font-weight: 700; }
.lv-secret { color: var(--gold); }

/* Robots */
.robot-stage { display: flex; align-items: center; gap: 18px; padding: 4px 2px 10px; }
#robot-preview { width: 150px; height: 116px; flex: none; }
.robot-info h3 { font-size: 15px; letter-spacing: .12em; }
.robot-info p { font-size: 11px; color: var(--dim); margin-top: 5px; max-width: 42ch; }
.robot-lock { color: var(--gold) !important; }
.skins { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; align-content: start; }
.skin { border: 1px solid var(--line); border-radius: 12px; background: rgba(16, 20, 46, .7); padding: 6px; cursor: pointer; }
.skin canvas { width: 100%; height: 52px; display: block; }
.skin span { display: block; font-size: 9px; text-align: center; color: var(--dim); letter-spacing: .06em; margin-top: 2px; }
.skin.sel { border-color: var(--cyan); background: rgba(63, 232, 255, .12); }
.skin.locked { opacity: .38; }

/* Statistiques / paramètres */
.stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.stat { border: 1px solid var(--line); border-radius: 12px; background: rgba(16, 20, 46, .7); padding: 11px 13px; }
.stat b { display: block; font-size: 21px; color: var(--cyan); font-variant-numeric: tabular-nums; }
.stat small { font-size: 9.5px; color: var(--dim); letter-spacing: .1em; }
.stat.wide { grid-column: 1 / -1; }
.stat.wide b { font-size: 14px; color: var(--white); }
.ach { display: flex; gap: 10px; align-items: center; border-bottom: 1px solid rgba(123, 92, 255, .14); padding: 9px 2px; }
.ach i { font-style: normal; width: 22px; text-align: center; }
.ach.done i { color: var(--gold); }
.ach div { flex: 1; }
.ach b { font-size: 11.5px; letter-spacing: .06em; }
.ach small { display: block; font-size: 10px; color: var(--dim); }
.ach.todo b, .ach.todo small { opacity: .45; }

.row { display: flex; align-items: center; gap: 14px; padding: 12px 4px; border-bottom: 1px solid rgba(123, 92, 255, .14); }
.row label { flex: 1; font-size: 12px; letter-spacing: .08em; }
.row small { display: block; font-size: 10px; color: var(--dim); letter-spacing: 0; margin-top: 2px; }
.row input[type=range] { width: 130px; accent-color: var(--cyan); }
.seg { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { background: transparent; border: 0; color: var(--dim); padding: 8px 12px; font-size: 11px; cursor: pointer; letter-spacing: .08em; }
.seg button.on { background: rgba(63, 232, 255, .18); color: var(--white); }
.danger-btn { border-color: rgba(255, 59, 92, .5); color: #ff8ea1; }

/* Panneaux (pause, victoire) */
.panel { width: min(92vw, 420px); background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 20px; text-align: center; backdrop-filter: blur(14px); }
.panel h2 { font-size: 17px; letter-spacing: .2em; margin-bottom: 4px; }
.panel-sub { font-size: 11px; color: var(--dim); margin-bottom: 14px; }
.panel .btn { text-align: center; margin-top: 8px; width: 100%; }
.win-stamp { display: inline-block; font-size: 9.5px; letter-spacing: .3em; color: var(--cyan); border: 1px solid rgba(63, 232, 255, .45); border-radius: 999px; padding: 4px 12px; margin-bottom: 10px; }
.win-line { font-size: 11.5px; color: var(--dim); margin: 6px 0 14px; font-style: italic; }
.win-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 6px; }
.win-grid div { background: rgba(8, 10, 28, .6); border-radius: 12px; padding: 9px 4px; }
.win-grid span { display: block; font-size: 16px; font-weight: 700; color: var(--cyan); font-variant-numeric: tabular-nums; }
.win-grid small { font-size: 8.5px; color: var(--dim); letter-spacing: .1em; }
.win-actions { display: flex; gap: 8px; margin-top: 12px; }
.win-actions .btn { flex: 1; font-size: 10.5px; padding: 12px 8px; letter-spacing: .1em; }

/* Écran trop étroit en portrait : on invite à tourner, sans bloquer le menu. */
@media (orientation: portrait) and (max-width: 620px) {
  #touch .pad { width: 60px; height: 60px; }
  .pad-jump { width: 72px; height: 72px; }
  [data-screen="menu"] { flex-direction: column; gap: 18px; }
  .menu-nav { width: 84vw; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation-duration: .01ms !important; }
}
/* La page hôte peut être n'importe quoi : on impose notre fond et notre cadre. */
html, body { background: #05060f; margin: 0; }
</style>

<script type="module">
/* ── src/engine/constants.js ─────────────────────────────────────── */
/**
 * VOID RUNNER — constantes de simulation.
 *
 * Toutes les valeurs sont en pixels et en secondes, dans l'espace "monde"
 * virtuel (hauteur de référence 360 px). Le rendu se contente de mettre à
 * l'échelle : la physique ne dépend JAMAIS de la résolution de l'écran.
 *
 * Règle absolue du projet : la simulation est déterministe. Pas de Math.random
 * dans la physique, pas de delta-time variable. Deux parties avec les mêmes
 * entrées produisent exactement le même résultat — c'est ce qui garantit
 * qu'une mort est toujours la faute du joueur, et c'est ce qui permet au
 * solveur automatique (tests/) de valider chaque niveau.
 */

// --- Pas de temps -----------------------------------------------------------
const TILE = 24; // unité de grille utilisée par les niveaux
const FIXED_DT = 1 / 60; // pas de simulation fixe
const MAX_FRAME_DT = 0.25; // anti "spirale de la mort" après un lag

// --- Dimensions du monde de référence ---------------------------------------
const VIEW_H = 360; // hauteur virtuelle constante
const VIEW_W_MIN = 560; // largeur mini (tablette 4:3)
const VIEW_W_MAX = 900; // largeur maxi (téléphone très allongé)

// --- Robot ------------------------------------------------------------------
const PLAYER_W = 20;
const PLAYER_H = 22;

// Course
const RUN_SPEED = 190;
const ACCEL_GROUND = 2400;
const ACCEL_AIR = 1500;
const FRICTION_GROUND = 2800;
const FRICTION_AIR = 260;

// Saut : hauteur d'apex = JUMP_VEL² / (2 * GRAVITY) ≈ 87 px ≈ 3.6 tuiles
// Portée horizontale à pleine vitesse ≈ 118 px ≈ 4.9 tuiles
const GRAVITY = 1800;
const JUMP_VEL = 560;
const JUMP_CUT = 0.42; // saut variable : relâcher coupe l'élan
const MAX_FALL = 900;

// Confort de contrôle (indispensable pour que le jeu soit "juste")
const COYOTE_TIME = 0.09; // saut toléré après avoir quitté le sol
const JUMP_BUFFER = 0.12; // saut mémorisé avant de toucher le sol

// Dash (débloqué au chapitre 3)
const DASH_SPEED = 430;
const DASH_TIME = 0.16;
const DASH_ENDLAG = 0.06;

// Divers
const CORNER_CORRECT = 4; // "coin arrondi" : évite d'accrocher un angle
const SNAP_EPS = 0.01;

// --- Identifiants d'état de mort (pilotent l'animation + le son) -------------
const DEATH = {
  ZAP: 'zap', // électrocution
  CRUSH: 'crush', // écrasement
  BURN: 'burn', // laser
  FALL: 'fall', // chute dans le vide
  BOOM: 'boom', // générique
};

/* ── src/engine/math.js ──────────────────────────────────────────── */
/** Petites aides mathématiques — sans dépendance, sans allocation superflue. */

const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const sign = (v) => (v > 0 ? 1 : v < 0 ? -1 : 0);
const approach = (v, target, delta) =>
  v < target ? Math.min(v + delta, target) : Math.max(v - delta, target);

/** Amortisseur exponentiel indépendant du framerate (caméra, UI). */
const damp = (a, b, lambda, dt) => lerp(a, b, 1 - Math.exp(-lambda * dt));

/** Recouvrement de deux AABB (bords jointifs = pas de collision). */
function aabb(ax, ay, aw, ah, bx, by, bw, bh) {
  return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
}

/** Recouvrement avec marge (utile pour les zones de détection tolérantes). */
function aabbPad(a, b, pad = 0) {
  return aabb(a.x - pad, a.y - pad, a.w + pad * 2, a.h + pad * 2, b.x, b.y, b.w, b.h);
}

/**
 * Générateur pseudo-aléatoire déterministe (mulberry32).
 * Utilisé UNIQUEMENT pour le décor et les particules, jamais pour le gameplay.
 */
function makeRng(seed = 1) {
  let a = seed >>> 0;
  return function rng() {
    a |= 0;
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/** Formatage humain d'un chrono : 21.43 -> "21.43 s" */
function formatTime(sec) {
  if (sec == null || !isFinite(sec)) return '—';
  if (sec >= 60) {
    const m = Math.floor(sec / 60);
    return `${m}:${(sec % 60).toFixed(2).padStart(5, '0')}`;
  }
  return `${sec.toFixed(2)} s`;
}

/** 1284 -> "1 284" (séparateur français) */
function formatInt(n) {
  return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
}

/* ── src/engine/Player.js ────────────────────────────────────────── */
/**
 * Le robot.
 *
 * Tout ce qui rend un platformer agréable est ici, et rien d'autre :
 *  - accélération/friction séparées sol et air ;
 *  - saut à hauteur variable (relâcher = saut court) ;
 *  - coyote time (saut toléré juste après le vide) ;
 *  - jump buffer (saut mémorisé juste avant l'atterrissage) ;
 *  - correction de coin (on n'accroche jamais un angle de plateforme).
 *
 * Ces quatre derniers points ne sont pas du confort : sans eux, le joueur
 * accuse les contrôles au lieu d'accuser sa décision. Or c'est la règle
 * absolue du jeu — difficile, mais juste.
 */
class Player {
  constructor(x, y, world) {
    this.world = world;
    this.w = PLAYER_W;
    this.h = PLAYER_H;
    this.x = x;
    this.y = y;
    this.vx = 0;
    this.vy = 0;

    this.gravDir = 1; // +1 = gravité vers le bas, -1 = inversée
    this.grounded = false;
    this.groundEnt = null;
    this.facing = 1;
    this.dead = false;

    this.coyote = 0;
    this.buffer = 0;
    this.jumpHeld = false;
    this.jumping = false;

    this.canDash = world.opts?.dash === true;
    this.dashLeft = 0; // temps de dash restant
    this.dashReady = true;
    this.endlag = 0;

    // Modificateurs appliqués par les champs (ventilateurs, aimants, zones)
    this.windX = 0;
    this.windY = 0;
    this.speedMul = 1;
    this.frictionMul = 1;
    this.noControl = 0; // secondes de perte de contrôle (téléporteur, choc)

    this.anim = 'idle';
    this.animT = 0;
    this.squash = 0; // -1 aplati, +1 étiré (feedback visuel)
    this.wasGrounded = false;
    this.landImpact = 0;
  }

  get cx() { return this.x + this.w / 2; }
  get cy() { return this.y + this.h / 2; }
  get bottom() { return this.y + this.h; }
  get right() { return this.x + this.w; }

  /** Le sol se trouve dans la direction de la gravité. */
  probeGround() {
    const g = this.gravDir;
    const s = this.world.overlapsSolid(this.x + 1, this.y + g, this.w - 2, this.h);
    return s;
  }

  step(input, dt) {
    const W = this.world;
    const g = this.gravDir;

    this.animT += dt;
    if (this.noControl > 0) this.noControl -= dt;
    const controlled = this.noControl <= 0;

    // --- Entrées ------------------------------------------------------------
    let dir = 0;
    if (controlled) dir = (input.right ? 1 : 0) - (input.left ? 1 : 0);
    if (dir !== 0) this.facing = dir;

    if (input.jumpPressed) this.buffer = JUMP_BUFFER;
    else this.buffer = Math.max(0, this.buffer - dt);

    // Relâcher le saut coupe l'élan : c'est ce qui permet le "petit saut"
    // exigé par le niveau 1 (sauter, mais pas trop haut).
    if (this.jumpHeld && !input.jump && this.jumping) {
      if (this.vy * g < 0) this.vy *= JUMP_CUT;
      this.jumping = false;
    }
    this.jumpHeld = input.jump;

    // --- Dash ---------------------------------------------------------------
    if (this.dashLeft > 0) {
      this.dashLeft -= dt;
      this.vx = DASH_SPEED * this.facing;
      this.vy = 0;
      if (this.dashLeft <= 0) {
        this.vx *= 0.55;
        this.endlag = DASH_ENDLAG;
      }
    } else if (
      controlled && this.canDash && input.dashPressed && this.dashReady
    ) {
      this.dashLeft = DASH_TIME;
      this.dashReady = false;
      this.vy = 0;
      W.fx('dash', { x: this.cx, y: this.cy, dir: this.facing });
    }

    const dashing = this.dashLeft > 0;
    if (this.endlag > 0) this.endlag -= dt;

    // --- Déplacement horizontal --------------------------------------------
    if (!dashing) {
      const maxSpeed = RUN_SPEED * this.speedMul;
      if (dir !== 0) {
        const a = (this.grounded ? ACCEL_GROUND : ACCEL_AIR) * this.speedMul;
        // Demi-tour plus vif que l'accélération pure : réactivité.
        const turn = sign(this.vx) !== 0 && sign(this.vx) !== dir ? 1.8 : 1;
        this.vx = approach(this.vx, maxSpeed * dir, a * turn * dt);
      } else {
        const f = (this.grounded ? FRICTION_GROUND : FRICTION_AIR) * this.frictionMul;
        this.vx = approach(this.vx, 0, f * dt);
      }
      this.vx += this.windX * dt;
    }

    // --- Saut ---------------------------------------------------------------
    if (this.grounded) this.coyote = COYOTE_TIME;
    else this.coyote = Math.max(0, this.coyote - dt);

    if (this.buffer > 0 && this.coyote > 0 && !dashing) {
      this.vy = -JUMP_VEL * g;
      this.buffer = 0;
      this.coyote = 0;
      this.jumping = true;
      this.grounded = false;
      this.squash = 0.6;
      W.fx('jump', { x: this.cx, y: this.bottom });
    }

    // --- Gravité ------------------------------------------------------------
    if (!dashing) {
      this.vy += (GRAVITY * g + this.windY) * dt;
      if (this.vy * g > MAX_FALL) this.vy = MAX_FALL * g;
    }

    // --- Intégration + collisions ------------------------------------------
    this.moveX(this.vx * dt);
    this.moveY(this.vy * dt);

    // --- Sol ----------------------------------------------------------------
    const ground = this.probeGround();
    this.wasGrounded = this.grounded;
    this.grounded = !!ground && this.vy * g >= -0.001;
    this.groundEnt = this.grounded ? ground : null;
    if (this.grounded) {
      this.dashReady = true;
      this.jumping = false;
      if (!this.wasGrounded) {
        const impact = Math.min(1, Math.abs(this.vy) / MAX_FALL);
        this.landImpact = impact;
        this.squash = -0.55 * impact - 0.15;
        W.fx('land', { x: this.cx, y: this.bottom, power: impact });
      }
      ground.onStand?.(W, this);
    }

    // --- Écrasement ---------------------------------------------------------
    if (W.overlapsSolid(this.x + 2, this.y + 2, this.w - 4, this.h - 4)) {
      W.kill(DEATH.CRUSH);
    }

    // --- Animation ----------------------------------------------------------
    this.squash = approach(this.squash, 0, dt * 4.5);
    if (dashing) this.anim = 'dash';
    else if (!this.grounded) this.anim = this.vy * g < 0 ? 'jump' : 'fall';
    else if (Math.abs(this.vx) > 12) this.anim = 'run';
    else this.anim = 'idle';

    // Les modificateurs de champ sont réinitialisés : chaque zone les repose.
    this.windX = 0;
    this.windY = 0;
    this.speedMul = 1;
    this.frictionMul = 1;
  }

  /** Déplacement horizontal, sous-échantillonné pour ne jamais traverser. */
  moveX(d) {
    const steps = Math.max(1, Math.ceil(Math.abs(d) / 6));
    const inc = d / steps;
    for (let i = 0; i < steps; i++) {
      const nx = this.x + inc;
      const hit = this.world.overlapsSolid(nx, this.y, this.w, this.h);
      if (hit) {
        this.x = inc > 0 ? hit.x - this.w : hit.x + hit.w;
        this.vx = 0;
        hit.onSideHit?.(this.world, this);
        return;
      }
      this.x = nx;
    }
  }

  moveY(d) {
    const steps = Math.max(1, Math.ceil(Math.abs(d) / 6));
    const inc = d / steps;
    for (let i = 0; i < steps; i++) {
      const ny = this.y + inc;
      const hit = this.world.overlapsSolid(this.x, ny, this.w, this.h);
      if (hit) {
        // Correction de coin : si seul un petit bout de la tête accroche,
        // on décale latéralement plutôt que de stopper net le saut.
        if (inc * this.gravDir < 0) {
          const over = this.correctCorner(hit, ny);
          if (over) continue;
        }
        this.y = inc > 0 ? hit.y - this.h : hit.y + hit.h;
        this.vy = 0;
        hit.onHit?.(this.world, this);
        return;
      }
      this.y = ny;
    }
  }

  correctCorner(hit, ny) {
    for (const s of [1, -1]) {
      for (let px = 1; px <= CORNER_CORRECT; px++) {
        const tx = this.x + px * s;
        if (!this.world.overlapsSolid(tx, ny, this.w, this.h)) {
          this.x = tx;
          this.y = ny;
          return true;
        }
      }
    }
    return false;
  }

  /** Téléportation propre (téléporteurs, sortie-piège, inversion de gravité). */
  warp(x, y, keepVel = false) {
    this.x = x - this.w / 2;
    this.y = y - this.h / 2;
    if (!keepVel) { this.vx = 0; this.vy = 0; }
    this.noControl = 0.08;
    this.world.fx('warp', { x, y });
  }
}

/* ── src/engine/entities/base.js ─────────────────────────────────── */
/**
 * Entité de base.
 *
 * Toute mécanique du jeu est une entité. Une entité peut être :
 *  - solide (le joueur s'y appuie) ;
 *  - mortelle (`deadly`) ;
 *  - logique (bouton, zone, mémoire — ni solide ni mortelle).
 *
 * Une entité ne dessine rien : le renderer lit ses champs publics. Cela garde
 * le moteur exécutable hors navigateur.
 */
class Entity {
  constructor(spec, world) {
    this.type = spec.t;
    this.id = spec.id ?? null;
    this.spec = spec;
    // Les niveaux sont écrits en TUILES (lisible à la main), convertis ici en
    // pixels une seule fois, au chargement.
    this.x = (spec.x ?? 0) * TILE;
    this.y = (spec.y ?? 0) * TILE;
    this.w = (spec.w ?? 1) * TILE;
    this.h = (spec.h ?? 1) * TILE;
    this.solid = false;
    this.deadly = false;
    this.active = true;
    this.deathKind = DEATH.BOOM;
    this.vx = 0;
    this.vy = 0;
    // Champs purement cosmétiques lus par le renderer
    this.flash = 0;
    this.alpha = 1;
  }

  /** Le signal (optionnel) qui conditionne l'activité de l'entité. */
  gateOpen(world) {
    const s = this.spec.signal;
    if (!s) return true;
    const on = world.isOn(s);
    return this.spec.invert ? !on : on;
  }

  touchesPlayer(world, pad = 0) {
    const p = world.player;
    return aabb(
      this.x - pad, this.y - pad, this.w + pad * 2, this.h + pad * 2,
      p.x, p.y, p.w, p.h,
    );
  }
}

/**
 * Corps solide mobile.
 *
 * Le déplacement d'un solide est la partie délicate d'un platformer : il doit
 * PORTER le joueur posé dessus et le POUSSER s'il le percute — et provoquer un
 * écrasement franc s'il le coince contre un autre solide. Sans cela, les
 * plateformes mobiles et les plafonds descendants seraient injustes.
 */
class SolidBody extends Entity {
  constructor(spec, world) {
    super(spec, world);
    this.solid = true;
  }

  isRider(p) {
    if (p.dead) return false;
    const g = p.gravDir;
    const xo = p.x < this.x + this.w - 0.5 && p.x + p.w > this.x + 0.5;
    if (!xo) return false;
    if (g > 0) return Math.abs(p.y + p.h - this.y) <= 2.5;
    return Math.abs(p.y - (this.y + this.h)) <= 2.5;
  }

  /** Déplace le solide de (dx, dy) en gérant portage, poussée et écrasement. */
  moveBy(dx, dy, world) {
    if (dx === 0 && dy === 0) return;
    const p = world.player;
    const riding = this.isRider(p);

    this.x += dx;
    this.y += dy;
    this.vx = dx;
    this.vy = dy;

    if (p.dead || world.state !== 'run') return;

    if (aabb(this.x, this.y, this.w, this.h, p.x, p.y, p.w, p.h)) {
      // Poussée : on éjecte le joueur dans le sens du mouvement.
      if (dy !== 0) {
        p.y = dy > 0 ? this.y + this.h : this.y - p.h;
        if (dy > 0 && p.vy < 0) p.vy = 0;
        if (dy < 0) p.vy = Math.min(p.vy, dy / 0.0166);
      }
      if (dx !== 0) {
        p.x = dx > 0 ? this.x + this.w : this.x - p.w;
      }
      if (world.overlapsSolid(p.x + 1.5, p.y + 1.5, p.w - 3, p.h - 3, this)) {
        world.kill(DEATH.CRUSH, this);
        return;
      }
    } else if (riding) {
      // Portage : le joueur suit exactement la plateforme.
      p.x += dx;
      p.y += dy;
      if (world.overlapsSolid(p.x + 1.5, p.y + 1.5, p.w - 3, p.h - 3, this)) {
        world.kill(DEATH.CRUSH, this);
      }
    }
  }
}

/* ── src/engine/entities/platforms.js ────────────────────────────── */
/** Bloc fixe. La brique de base de toute salle. */
class Solid extends SolidBody {
  constructor(spec, world) {
    super(spec, world);
    this.style = spec.style || 'wall'; // wall | metal | glass | pipe
  }
}

/**
 * Sol qui s'effondre.
 * Le joueur pose le pied, un grondement, puis plus rien.
 * `delay` doit rester généreux (>= 0.25 s) : le piège doit surprendre, pas
 * être impossible à quitter.
 */
class Crumble extends SolidBody {
  constructor(spec, world) {
    super(spec, world);
    this.delay = spec.delay ?? 0.4;
    this.respawn = spec.respawn ?? 2.2;
    this.t = -1; // -1 = intact
    this.gone = 0;
    this.style = 'crumble';
    this.shake = 0;
  }

  onStand(world) {
    if (this.t < 0) {
      this.t = this.delay;
      world.fx('creak', { x: this.x + this.w / 2, y: this.y });
    }
  }

  preStep(world, dt) {
    if (this.t > 0) {
      this.t -= dt;
      this.shake = clamp(1 - this.t / this.delay, 0, 1);
      if (this.t <= 0) {
        this.active = false;
        this.gone = this.respawn;
        world.fx('crumble', { x: this.x + this.w / 2, y: this.y + this.h / 2, w: this.w });
      }
    } else if (!this.active) {
      this.gone -= dt;
      if (this.respawn > 0 && this.gone <= 0) {
        // On ne réapparaît jamais dans le joueur : ce serait une mort injuste.
        const p = world.player;
        const inside = p.x < this.x + this.w && p.x + p.w > this.x &&
          p.y < this.y + this.h && p.y + p.h > this.y;
        if (!inside) {
          this.active = true;
          this.t = -1;
          this.shake = 0;
        }
      }
    }
  }
}

/**
 * Plateforme fantôme : elle disparaît selon un déclencheur.
 *  - onLand  : elle s'évapore dès que le robot se pose dessus ;
 *  - onLeave : elle disparaît quand il la quitte (piège au retour) ;
 *  - cycle   : elle clignote selon une période fixe (donc apprenable).
 */
class Vanish extends SolidBody {
  constructor(spec, world) {
    super(spec, world);
    this.mode = spec.mode || 'onLand';
    this.delay = spec.delay ?? 0.12;
    this.respawn = spec.respawn ?? 1.6;
    this.period = spec.period ?? 1.6;
    this.phase = spec.phase ?? 0;
    this.duty = spec.duty ?? 0.5;
    this.t = -1;
    this.gone = 0;
    this.wasStood = false;
    this.style = 'vanish';
  }

  onStand() {
    if (this.mode === 'onLand' && this.t < 0) this.t = this.delay;
    this.wasStood = true;
  }

  preStep(world, dt) {
    if (this.mode === 'cycle') {
      const tt = (world.time + this.phase) % this.period;
      const on = tt < this.period * this.duty;
      this.active = on;
      this.alpha = on ? 1 : 0.18;
      return;
    }
    if (this.mode === 'onLeave') {
      const still = world.player.groundEnt === this;
      if (this.wasStood && !still && this.t < 0) this.t = this.delay;
      this.wasStood = still || this.wasStood;
    }
    if (this.t > 0) {
      this.t -= dt;
      this.alpha = 0.35 + 0.65 * (this.t / Math.max(0.001, this.delay));
      if (this.t <= 0) {
        this.active = false;
        this.alpha = 0;
        this.gone = this.respawn;
        world.fx('vanish', { x: this.x + this.w / 2, y: this.y + this.h / 2 });
      }
    } else if (!this.active && this.respawn > 0) {
      this.gone -= dt;
      if (this.gone <= 0) {
        const p = world.player;
        const inside = p.x < this.x + this.w && p.x + p.w > this.x &&
          p.y < this.y + this.h && p.y + p.h > this.y;
        if (!inside) {
          this.active = true;
          this.alpha = 1;
          this.t = -1;
          this.wasStood = false;
        }
      }
    }
  }
}

/**
 * Plateforme invisible.
 * Solide en permanence, mais dessinée seulement à proximité (ou jamais).
 * Piège honnête : le joueur voit toujours de fines particules trahir sa
 * présence — il ne peut donc pas dire que rien ne l'indiquait.
 */
class Ghost extends SolidBody {
  constructor(spec, world) {
    super(spec, world);
    this.reveal = spec.reveal || 'near'; // near | signal | never
    this.style = 'ghost';
    this.vis = 0;
  }

  preStep(world, dt) {
    let target = 0;
    if (this.reveal === 'near') {
      const p = world.player;
      const dx = Math.max(this.x - (p.x + p.w), p.x - (this.x + this.w), 0);
      const dy = Math.max(this.y - (p.y + p.h), p.y - (this.y + this.h), 0);
      target = Math.hypot(dx, dy) < TILE * 2.5 ? 1 : 0;
    } else if (this.reveal === 'signal') {
      target = this.gateOpen(world) ? 1 : 0;
    }
    this.vis += (target - this.vis) * Math.min(1, dt * 12);
  }
}

/**
 * Plateforme mobile / scie / ascenseur / mur qui avance.
 *
 * Un seul composant couvre tout ça, parce que c'est exactement la même chose :
 * un solide qui suit une trajectoire. Ce qui change, c'est le déclencheur et le
 * caractère mortel.
 *
 * trigger : 'auto' | 'signal' | 'stand' | 'near' | 'once'
 * mode    : 'loop' | 'pingpong' | 'once'
 */
class Mover extends SolidBody {
  constructor(spec, world) {
    super(spec, world);
    this.speed = spec.speed ?? 60;
    this.mode = spec.mode || 'pingpong';
    this.trigger = spec.trigger || 'auto';
    this.wait = spec.wait ?? 0;
    this.deadly = spec.deadly === true;
    this.deathKind = spec.deathKind || (spec.deadly ? DEATH.CRUSH : DEATH.BOOM);
    this.style = spec.style || (spec.deadly ? 'saw' : 'platform');
    this.nearRange = (spec.range ?? 4) * TILE;

    const pts = [[this.x, this.y]];
    for (const p of spec.path ?? []) pts.push([p[0] * TILE, p[1] * TILE]);
    this.pts = pts;
    this.i = 0;
    this.dir = 1;
    this.t = 0; // 0..1 le long du segment courant
    this.waitT = spec.delay ?? 0;
    this.running = this.trigger === 'auto';
    this.done = false;
    // Décalage de phase : permet de désynchroniser deux plateformes jumelles
    if (spec.phase) this.advance(spec.phase * this.speed, null);
  }

  onStand(world) {
    if (this.trigger === 'stand' && !this.running) {
      this.running = true;
      world.fx('mech', { x: this.x + this.w / 2, y: this.y });
    }
  }

  preStep(world, dt) {
    if (this.trigger === 'signal') {
      this.running = this.gateOpen(world);
    } else if (this.trigger === 'near' && !this.running) {
      const p = world.player;
      const dx = Math.abs(p.x + p.w / 2 - (this.x + this.w / 2));
      const dy = Math.abs(p.y + p.h / 2 - (this.y + this.h / 2));
      if (dx < this.nearRange && dy < this.nearRange * 1.5) {
        this.running = true;
        world.fx('mech', { x: this.x + this.w / 2, y: this.y });
      }
    }
    if (!this.running || this.done || this.pts.length < 2) return;

    if (this.waitT > 0) { this.waitT -= dt; return; }
    this.advance(this.speed * dt, world);
  }

  advance(dist, world) {
    let remain = dist;
    let guard = 0;
    while (remain > 0 && guard++ < 8) {
      const a = this.pts[this.i];
      const b = this.pts[this.i + this.dir];
      if (!b) { this.done = true; return; }
      const segLen = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1;
      const need = (1 - this.t) * segLen;
      if (remain < need) {
        this.t += remain / segLen;
        remain = 0;
      } else {
        remain -= need;
        this.t = 0;
        this.i += this.dir;
        // Fin de trajectoire : on boucle, on rebrousse ou on s'arrête.
        if (this.dir > 0 && this.i >= this.pts.length - 1) {
          if (this.mode === 'pingpong') { this.dir = -1; this.waitT = this.wait; }
          else if (this.mode === 'loop') { this.i = 0; this.waitT = this.wait; }
          else { this.done = true; this.i = this.pts.length - 1; break; }
        } else if (this.dir < 0 && this.i <= 0) {
          if (this.mode === 'pingpong') { this.dir = 1; this.waitT = this.wait; }
          else { this.done = true; break; }
        }
        if (this.waitT > 0) break;
      }
    }
    const a = this.pts[this.i];
    const b = this.pts[this.i + this.dir] || a;
    const nx = a[0] + (b[0] - a[0]) * this.t;
    const ny = a[1] + (b[1] - a[1]) * this.t;
    if (world) this.moveBy(nx - this.x, ny - this.y, world);
    else { this.x = nx; this.y = ny; }
  }
}

/**
 * Porte coulissante.
 * Elle glisse vraiment (elle n'est pas juste « désactivée ») : une porte qui se
 * referme sur le robot doit l'écraser pour de bon. C'est tout le niveau 3.
 */
class Door extends SolidBody {
  constructor(spec, world) {
    super(spec, world);
    this.speed = spec.speed ?? 260;
    this.slide = spec.slide || 'up';
    this.travel = (spec.travel ?? spec.h ?? 1) * TILE;
    this.openAmt = spec.startOpen ? 1 : 0;
    this.style = 'door';
    this.baseX = this.x;
    this.baseY = this.y;
    this.deathKind = DEATH.CRUSH;
    this.applyOffset(null);
  }

  offset() {
    const d = this.openAmt * this.travel;
    switch (this.slide) {
      case 'down': return [0, d];
      case 'left': return [-d, 0];
      case 'right': return [d, 0];
      default: return [0, -d];
    }
  }

  applyOffset(world) {
    const [ox, oy] = this.offset();
    const tx = this.baseX + ox;
    const ty = this.baseY + oy;
    if (world) this.moveBy(tx - this.x, ty - this.y, world);
    else { this.x = tx; this.y = ty; }
  }

  preStep(world, dt) {
    const target = this.gateOpen(world) ? 1 : 0;
    if (this.openAmt !== target) {
      const step = (this.speed / this.travel) * dt;
      this.openAmt += Math.sign(target - this.openAmt) * step;
      this.openAmt = clamp(this.openAmt, 0, 1);
      this.applyOffset(world);
      this.flash = 0.4;
    }
  }
}

/**
 * Presse : plafond, mur ou piston qui fonce sur une position cible.
 * `hold` = temps d'attente en bout de course, `back` = vitesse de retour
 * (0 = ne revient pas).
 */
class Crusher extends SolidBody {
  constructor(spec, world) {
    super(spec, world);
    this.speed = spec.speed ?? 420;
    this.back = spec.back ?? 90;
    this.hold = spec.hold ?? 0.35;
    this.trigger = spec.trigger || 'near';
    this.range = (spec.range ?? 3) * TILE;
    this.axis = spec.axis || 'y';
    this.to = (spec.to ?? 3) * TILE; // déplacement relatif, en tuiles
    this.baseX = this.x;
    this.baseY = this.y;
    this.p = 0; // progression 0..1
    this.phase = 'idle'; // idle | strike | hold | back
    this.holdT = 0;
    this.deadly = false; // c'est l'écrasement (moveBy) qui tue, pas le contact
    this.style = 'crusher';
    this.warn = 0;
  }

  preStep(world, dt) {
    const p = world.player;
    if (this.phase === 'idle') {
      let fire = false;
      if (this.trigger === 'signal') fire = this.gateOpen(world);
      else if (this.trigger === 'near') {
        const cx = this.baseX + this.w / 2;
        const cy = this.baseY + this.h / 2;
        fire = this.axis === 'y'
          ? Math.abs(p.x + p.w / 2 - cx) < this.range
          : Math.abs(p.y + p.h / 2 - cy) < this.range;
      }
      if (fire) {
        this.phase = 'strike';
        world.fx('alarm', { x: this.baseX + this.w / 2, y: this.baseY });
      }
    }

    if (this.phase === 'strike') {
      this.warn = Math.min(1, this.warn + dt * 6);
      this.p = Math.min(1, this.p + (this.speed / Math.abs(this.to)) * dt);
      if (this.p >= 1) { this.phase = 'hold'; this.holdT = this.hold; world.fx('slam', { x: this.baseX + this.w / 2, y: this.baseY }); }
    } else if (this.phase === 'hold') {
      this.holdT -= dt;
      if (this.holdT <= 0) this.phase = this.back > 0 ? 'back' : 'stuck';
    } else if (this.phase === 'back') {
      this.p = Math.max(0, this.p - (this.back / Math.abs(this.to)) * dt);
      if (this.p <= 0) { this.phase = 'idle'; this.warn = 0; }
    }

    const d = this.p * this.to;
    const tx = this.axis === 'x' ? this.baseX + d : this.baseX;
    const ty = this.axis === 'y' ? this.baseY + d : this.baseY;
    this.moveBy(tx - this.x, ty - this.y, world);
  }
}

/* ── src/engine/entities/hazards.js ──────────────────────────────── */
/**
 * Surface dangereuse fixe : sol électrifié, arête chauffée, grille haute
 * tension. Toujours ORANGE — la charte couleur est une promesse faite au
 * joueur : orange = ça tue, rouge = ça va tuer.
 */
class Zap extends Entity {
  constructor(spec, world) {
    super(spec, world);
    this.deadly = true;
    this.deathKind = spec.deathKind || DEATH.ZAP;
    this.dir = spec.dir || 'up'; // orientation des picots (rendu)
    this.style = spec.style || 'zap';
    // Cycle optionnel : [durée allumé, durée éteint]. Apprenable, donc juste.
    this.cycle = spec.cycle || null;
    this.phase = spec.phase ?? 0;
  }

  preStep(world) {
    let on = this.gateOpen(world);
    if (on && this.cycle) {
      const period = this.cycle[0] + this.cycle[1];
      const t = (world.time + this.phase) % period;
      on = t < this.cycle[0];
    }
    this.deadly = on;
    this.alpha = on ? 1 : 0.25;
  }
}

/**
 * Laser.
 *
 * Un émetteur projette un faisceau jusqu'au premier solide rencontré : le
 * faisceau est donc bloqué par une plateforme mobile, ce qui ouvre du level
 * design (« se cacher derrière la caisse »).
 *
 * dir : 'right' | 'left' | 'up' | 'down'
 * cycle : [allumé, éteint] — un laser permanent est indiqué par cycle absent.
 */
class Laser extends Entity {
  constructor(spec, world) {
    super(spec, world);
    this.dir = spec.dir || 'right';
    this.maxLen = (spec.len ?? 20) * TILE;
    this.cycle = spec.cycle || null;
    this.phase = spec.phase ?? 0;
    this.warn = spec.warn ?? 0.35; // pré-signal rouge avant l'allumage
    this.thick = spec.thick ?? 5;
    this.deathKind = DEATH.BURN;
    this.on = false;
    this.charging = 0;
    this.beam = { x: 0, y: 0, w: 0, h: 0 };
    this.w = TILE * 0.5;
    this.h = TILE * 0.5;
    this.deadly = false;
    // Un laser peut n'exister qu'après un déclencheur (niveau 1 : le petit
    // laser n'apparaît que si le joueur saute).
    this.armed = spec.armSignal ? false : true;
    this.armSignal = spec.armSignal || null;
  }

  computeBeam(world) {
    const cx = this.x + this.w / 2;
    const cy = this.y + this.h / 2;
    let len = this.maxLen;
    const horiz = this.dir === 'left' || this.dir === 'right';
    const s = this.dir === 'left' || this.dir === 'up' ? -1 : 1;
    const stepPx = 4;
    for (let d = 0; d < this.maxLen; d += stepPx) {
      const px = horiz ? cx + s * d : cx;
      const py = horiz ? cy : cy + s * d;
      if (world.overlapsSolid(px - 1, py - 1, 2, 2, this)) { len = d; break; }
    }
    if (horiz) {
      this.beam.x = s > 0 ? cx : cx - len;
      this.beam.y = cy - this.thick / 2;
      this.beam.w = len;
      this.beam.h = this.thick;
    } else {
      this.beam.x = cx - this.thick / 2;
      this.beam.y = s > 0 ? cy : cy - len;
      this.beam.w = this.thick;
      this.beam.h = len;
    }
  }

  preStep(world, dt) {
    if (this.armSignal && !this.armed && world.isOn(this.armSignal)) {
      this.armed = true;
      this.chargeT = 0;
      world.fx('charge', { x: this.x, y: this.y });
    }
    if (!this.armed) { this.deadly = false; this.on = false; return; }

    let want = this.gateOpen(world);
    if (want && this.cycle) {
      const period = this.cycle[0] + this.cycle[1];
      const t = (world.time + this.phase) % period;
      want = t < this.cycle[0];
      // Pré-signal : la lueur rouge annonce toujours le tir.
      this.charging = !want && t > period - this.warn ? 1 : 0;
    }
    const wasOn = this.on;
    this.on = want;
    if (this.on && !wasOn) world.fx('laser', { x: this.x, y: this.y });
    this.computeBeam(world);
    this.deadly = this.on;
  }

  hazardBox() {
    return this.on ? this.beam : null;
  }
}

/* ── src/engine/entities/logic.js ────────────────────────────────── */
/**
 * Porte de sortie.
 *
 * Elle peut mentir, et c'est tout l'intérêt :
 *  - fake:'flee' — elle recule quand on approche (il existe un autre chemin) ;
 *  - fake:'warp' — elle téléporte le robot au départ (fausse sortie) ;
 *  - fake:'trap' — elle se referme en piège mortel ;
 *  - requires    — elle est verrouillée tant qu'un signal n'est pas actif.
 *
 * Une sortie menteuse doit TOUJOURS être identifiable après coup : une vraie
 * sortie a un halo cyan stable, une fausse a un halo qui vacille très
 * légèrement. Le joueur ne peut pas le voir la première fois, mais il le
 * revoit immédiatement à la deuxième tentative. C'est la limite entre une
 * bonne farce et une mort arbitraire.
 */
class Exit extends Entity {
  constructor(spec, world) {
    super(spec, world);
    this.w = (spec.w ?? 1.4) * TILE;
    this.h = (spec.h ?? 2) * TILE;
    this.fake = spec.fake || false;
    this.to = spec.to || null;
    this.requires = spec.requires || null;
    this.range = (spec.range ?? 3) * TILE;
    this.fled = 0;
    this.style = 'exit';
    this.open = 1;
    this.used = false;
  }

  preStep(world, dt) {
    if (this.requires) {
      const ok = world.isOn(this.requires);
      this.open += ((ok ? 1 : 0) - this.open) * Math.min(1, dt * 6);
    }
    if (this.fake === 'flee' && this.to) {
      const p = world.player;
      const d = Math.hypot(p.cx - (this.x + this.w / 2), p.cy - (this.y + this.h / 2));
      // Une fois la fuite amorcée, elle va jusqu'au bout : sinon la sortie
      // s'arrêterait en plein vide dès que le joueur cesse de la suivre.
      if (d < this.range) this.fleeing = true;
      if (this.fleeing) this.fled = Math.min(1, this.fled + dt * 1.9);
      const tx = (this.spec.x * TILE) + (this.to[0] * TILE - this.spec.x * TILE) * this.fled;
      const ty = (this.spec.y * TILE) + (this.to[1] * TILE - this.spec.y * TILE) * this.fled;
      if (this.fled > 0 && (tx !== this.x || ty !== this.y)) {
        if (this.fled < 0.02) world.fx('mech', { x: this.x, y: this.y });
        this.x = tx;
        this.y = ty;
      }
    }
  }

  postStep(world) {
    if (this.used || !this.touchesPlayer(world, -2)) return;
    if (this.requires && !world.isOn(this.requires)) {
      this.flash = 1;
      return;
    }
    if (this.fake === 'warp') {
      const sp = this.to || [world.level.spawn.x, world.level.spawn.y];
      world.player.warp(sp[0] * TILE + world.player.w / 2, sp[1] * TILE + world.player.h / 2);
      world.setSignal(this.spec.emits || '__fakeExit', true);
      world.fx('fakeExit', { x: this.x + this.w / 2, y: this.y + this.h / 2 });
      return;
    }
    if (this.fake === 'trap') {
      world.kill(DEATH.BURN, this);
      return;
    }
    if (this.fake === 'flee' && this.fled < 0.98) return;
    world.win();
  }
}

/**
 * Bouton / plaque de pression.
 * mode : 'hold' (actif tant qu'on appuie) | 'toggle' | 'once'
 * Un bouton n'est jamais neutre dans ce jeu : il fait toujours QUELQUE CHOSE.
 */
class Button extends Entity {
  constructor(spec, world) {
    super(spec, world);
    this.h = (spec.h ?? 0.4) * TILE;
    this.mode = spec.mode || 'once';
    this.out = spec.emits || spec.out || 'a';
    this.value = spec.value !== false;
    this.pressed = false;
    this.latched = false;
    this.style = 'button';
    this.press = 0;
    // Un bouton temporisé se réarme tout seul : c'est ce qui empêche un
    // niveau à séquence de devenir insoluble après une erreur d'ordre.
    this.autoOff = spec.autoOff ?? 0;
    this.offT = 0;
  }

  preStep(world, dt) {
    if (this.autoOff > 0 && this.offT > 0) {
      this.offT -= dt;
      if (this.offT <= 0) {
        world.setSignal(this.out, !this.value);
        this.latched = false;
        world.fx('unclick', { x: this.x + this.w / 2, y: this.y });
      }
    }
  }

  postStep(world) {
    const p = world.player;
    const touching = aabb(this.x, this.y - 3, this.w, this.h + 6, p.x, p.y, p.w, p.h);
    const rising = touching && !this.pressed;
    this.pressed = touching;
    this.press += ((touching ? 1 : 0) - this.press) * 0.35;

    if (this.mode === 'hold') {
      world.setSignal(this.out, touching ? this.value : !this.value);
    } else if (rising) {
      if (this.mode === 'toggle') world.setSignal(this.out, !world.isOn(this.out));
      else if (!this.latched) { world.setSignal(this.out, this.value); this.latched = true; }
      if (this.autoOff > 0) this.offT = this.autoOff;
      world.fx('click', { x: this.x + this.w / 2, y: this.y });
    }
  }
}

/**
 * Zone de déclenchement invisible.
 * mode : 'stay' | 'enter' | 'exit' | 'once'
 * `remember` inscrit une clé dans la mémoire persistante du niveau (voir
 * MemGate) : c'est la base des mécaniques qui évoluent entre deux tentatives.
 */
class Zone extends Entity {
  constructor(spec, world) {
    super(spec, world);
    this.mode = spec.mode || 'once';
    this.out = spec.emits || spec.out || null;
    this.value = spec.value !== false;
    this.inside = false;
    this.latched = false;
    this.remember = spec.remember || null;
  }

  postStep(world) {
    const now = this.touchesPlayer(world);
    const enter = now && !this.inside;
    const exit = !now && this.inside;
    this.inside = now;

    if (enter && this.remember) {
      world.memory.set(this.remember, (world.memory.get(this.remember) || 0) + 1);
    }
    if (!this.out) return;
    if (this.mode === 'stay') world.setSignal(this.out, now ? this.value : !this.value);
    else if (this.mode === 'enter' && enter) world.setSignal(this.out, this.value);
    else if (this.mode === 'exit' && exit) world.setSignal(this.out, this.value);
    else if (this.mode === 'once' && enter && !this.latched) {
      this.latched = true;
      world.setSignal(this.out, this.value);
    }
  }
}

/**
 * Minuterie : rediffuse un signal après un délai.
 * Indispensable pour les portes temporisées et pour toutes les farces du type
 * « ça se referme trois secondes après ».
 */
class Timer extends Entity {
  constructor(spec, world) {
    super(spec, world);
    this.from = spec.from || null; // null = démarre au début du niveau
    this.delay = spec.delay ?? 1;
    this.out = spec.emits || spec.out;
    this.value = spec.value !== false;
    this.repeat = spec.repeat === true;
    this.t = this.from ? -1 : this.delay;
    this.done = false;
    this.deadly = false;
  }

  preStep(world, dt) {
    if (this.done) return;
    if (this.t < 0) {
      if (this.from && world.isOn(this.from)) this.t = this.delay;
      return;
    }
    this.t -= dt;
    if (this.t <= 0) {
      world.setSignal(this.out, this.value);
      if (this.repeat) this.t = this.delay;
      else this.done = true;
    }
  }
}

/** Porte logique : permet de composer des mécanismes sans coder de niveau. */
class Logic extends Entity {
  constructor(spec, world) {
    super(spec, world);
    this.op = spec.op || 'and';
    this.in = spec.in || [];
    this.out = spec.emits || spec.out;
  }

  preStep(world) {
    const vals = this.in.map((s) => world.isOn(s));
    let r;
    if (this.op === 'and') r = vals.every(Boolean);
    else if (this.op === 'or') r = vals.some(Boolean);
    else if (this.op === 'not') r = !vals[0];
    else r = vals.filter(Boolean).length === 1; // xor
    world.setSignal(this.out, r);
  }
}

/**
 * Point de contrôle.
 * `fake:true` : il a exactement l'allure d'un checkpoint, il fait le bon son,
 * il ne sauvegarde rien. Ce mensonge n'est utilisé qu'une seule fois dans tout
 * le jeu (niveau 18) — une farce répétée n'est plus une farce, c'est une taxe.
 */
class Checkpoint extends Entity {
  constructor(spec, world) {
    super(spec, world);
    this.w = (spec.w ?? 1) * TILE;
    this.h = (spec.h ?? 1.5) * TILE;
    this.fake = spec.fake === true;
    this.taken = false;
    this.style = 'check';
  }

  postStep(world) {
    if (this.taken || !this.touchesPlayer(world)) return;
    this.taken = true;
    if (!this.fake) {
      world.checkpoint = { x: this.x + this.w / 2, y: this.y + this.h - 2 };
      world.fx('checkpoint', { x: this.x, y: this.y });
    } else {
      world.fx('checkpointFake', { x: this.x, y: this.y });
      if (this.spec.emits) world.setSignal(this.spec.emits, true);
    }
  }
}

/** Téléporteur. Envoie le robot sur `to` (en tuiles), une fois ou en boucle. */
class Teleport extends Entity {
  constructor(spec, world) {
    super(spec, world);
    this.to = spec.to || [1, 1];
    this.cool = 0;
    this.keepVel = spec.keepVel === true;
    this.style = 'tele';
  }

  preStep(world, dt) {
    if (this.cool > 0) this.cool -= dt;
  }

  postStep(world) {
    if (this.cool > 0 || !this.touchesPlayer(world, -2)) return;
    this.cool = 0.45;
    world.player.warp(this.to[0] * TILE, this.to[1] * TILE, this.keepVel);
    if (this.spec.emits) world.setSignal(this.spec.emits, true);
  }
}

/**
 * Champ de gravité artificielle.
 * mode 'zone' : la gravité vaut `dir` tant qu'on est dedans.
 * mode 'flip' : elle s'inverse à l'entrée, et ça reste.
 */
class Gravity extends Entity {
  constructor(spec, world) {
    super(spec, world);
    this.dir = spec.dir ?? -1;
    this.mode = spec.mode || 'flip';
    this.inside = false;
    this.style = 'grav';
  }

  postStep(world) {
    const now = this.touchesPlayer(world);
    const p = world.player;
    if (this.mode === 'zone') {
      if (now) p.gravDir = this.dir;
      else if (this.inside) p.gravDir = 1;
    } else if (now && !this.inside) {
      p.gravDir = this.dir === 'flip' ? -p.gravDir : this.dir;
      p.vy *= 0.2;
      world.fx('gravity', { x: p.cx, y: p.cy, dir: p.gravDir });
    }
    this.inside = now;
  }
}

/**
 * Mémoire inter-tentatives.
 * Émet un signal selon ce que le joueur a fait lors de ses essais précédents
 * (nombre de morts, zones visitées…). C'est ce qui permet à un niveau de
 * retourner la mémoire du joueur contre lui sans jamais tricher : la règle est
 * constante, c'est le joueur qui a changé.
 */
class MemGate extends Entity {
  constructor(spec, world) {
    super(spec, world);
    this.key = spec.key;
    this.gte = spec.gte ?? null;
    this.lt = spec.lt ?? null;
    this.out = spec.emits || spec.out;
    this.value = spec.value !== false;
  }

  preStep(world) {
    const v = world.memory.get(this.key) || 0;
    let ok = true;
    if (this.gte != null) ok = ok && v >= this.gte;
    if (this.lt != null) ok = ok && v < this.lt;
    world.setSignal(this.out, ok ? this.value : !this.value);
  }
}

/**
 * Clone : rejoue le trajet enregistré lors de la tentative précédente.
 * S'il est mortel, le joueur affronte littéralement son propre passé.
 */
class Clone extends Entity {
  constructor(spec, world) {
    super(spec, world);
    this.w = 20;
    this.h = 22;
    this.deadly = spec.deadly !== false;
    this.deathKind = DEATH.ZAP;
    this.offset = spec.delay ?? 0;
    // 'live'  : le robot poursuit son propre écho, avec `delay` de retard ;
    // 'prev'  : il affronte l'enregistrement de sa tentative précédente.
    this.source = spec.source || 'live';
    this.style = 'clone';
    this.facing = 1;
  }

  init(world) {
    this.trace = this.source === 'prev' ? (world.opts?.ghostTrace || null) : world.trace;
    this.active = !!this.trace;
  }

  preStep(world) {
    if (!this.trace) { this.deadly = false; return; }
    const i = Math.max(0, Math.floor((world.time - this.offset) * 60)) * 3;
    if (i + 2 >= this.trace.length) {
      this.deadly = false;
      this.alpha = 0;
      return;
    }
    if (world.time < this.offset) { this.deadly = false; this.alpha = 0; return; }
    this.alpha = 0.75;
    this.deadly = this.spec.deadly !== false;
    const nx = this.trace[i];
    this.facing = this.trace[i + 2] ? -1 : 1;
    this.x = nx;
    this.y = this.trace[i + 1];
  }
}

/**
 * Panneau d'information.
 * Peut dire la vérité. Peut mentir. Ne le fait jamais deux fois de la même
 * façon dans le même chapitre.
 */
class Sign extends Entity {
  constructor(spec, world) {
    super(spec, world);
    this.text = spec.text || '';
    this.arrow = spec.arrow || null;
    this.always = spec.always === true;
    this.style = 'sign';
    this.vis = 0;
  }

  preStep(world, dt) {
    const target = this.always || this.touchesPlayer(world, TILE * 2) ? 1 : 0;
    this.vis += (target - this.vis) * Math.min(1, dt * 8);
  }
}

/** Décor. Certains décors sont vraiment du décor. Certains non. */
class Deco extends Entity {
  constructor(spec, world) {
    super(spec, world);
    this.kind = spec.kind || 'panel';
    this.solid = spec.solid === true;
    this.style = 'deco';
  }
}

/* ── src/engine/entities/fields.js ───────────────────────────────── */
/**
 * Ventilateur / soufflerie.
 * Applique une accélération constante tant que le robot est dans le flux.
 * Le flux est arrêté par les solides : on peut donc se mettre à l'abri.
 */
class Fan extends Entity {
  constructor(spec, world) {
    super(spec, world);
    this.dir = spec.dir || 'up';
    this.force = spec.force ?? 2600;
    this.style = 'fan';
    this.spin = 0;
  }

  preStep(world, dt) {
    this.on = this.gateOpen(world);
    this.spin += this.on ? dt * 14 : dt * 1.5;
  }

  postStep(world) {
    if (!this.on || !this.touchesPlayer(world)) return;
    const p = world.player;
    switch (this.dir) {
      case 'down': p.windY += this.force; break;
      case 'left': p.windX -= this.force; break;
      case 'right': p.windX += this.force; break;
      // Une soufflerie ascendante doit pouvoir compenser la gravité, sinon
      // elle n'est qu'un ralentisseur — d'où une force par défaut > GRAVITY.
      default: p.windY -= this.force;
    }
  }
}

/**
 * Champ technique : ralentissement, accélération, magnétisme.
 * kind : 'slow' | 'fast' | 'magnet' | 'ice'
 */
class Field extends Entity {
  constructor(spec, world) {
    super(spec, world);
    this.kind = spec.kind || 'slow';
    this.amount = spec.amount ?? (this.kind === 'slow' ? 0.45 : 1.75);
    this.force = spec.force ?? 900;
    this.anchor = spec.anchor || null; // [x,y] en tuiles, pour le magnétisme
    this.style = 'field';
  }

  postStep(world) {
    if (!this.gateOpen(world) || !this.touchesPlayer(world)) return;
    const p = world.player;
    if (this.kind === 'slow' || this.kind === 'fast') {
      p.speedMul = this.amount;
    } else if (this.kind === 'ice') {
      p.frictionMul = 0.06;
    } else if (this.kind === 'magnet') {
      const ax = (this.anchor ? this.anchor[0] * TILE : this.x + this.w / 2);
      const ay = (this.anchor ? this.anchor[1] * TILE : this.y + this.h / 2);
      const dx = ax - p.cx;
      const dy = ay - p.cy;
      const d = Math.hypot(dx, dy) || 1;
      p.windX += (dx / d) * this.force;
      p.windY += (dy / d) * this.force;
    }
  }
}

/**
 * Registre des mécaniques.
 *
 * Ajouter un piège au jeu = ajouter une classe et une ligne ici. Les niveaux
 * n'ont jamais besoin d'être recodés : ce sont des données.
 */
const REGISTRY = {
  solid: Solid,
  crumble: Crumble,
  vanish: Vanish,
  ghost: Ghost,
  mover: Mover,
  door: Door,
  crusher: Crusher,
  zap: Zap,
  laser: Laser,
  exit: Exit,
  button: Button,
  zone: Zone,
  timer: Timer,
  logic: Logic,
  check: Checkpoint,
  tele: Teleport,
  grav: Gravity,
  memgate: MemGate,
  clone: Clone,
  sign: Sign,
  deco: Deco,
  fan: Fan,
  field: Field,
};

const ENTITY_TYPES = Object.keys(REGISTRY);

function createEntity(spec, world) {
  const C = REGISTRY[spec.t];
  if (!C) {
    // Un niveau mal écrit ne doit pas planter le jeu en production ; il doit
    // en revanche faire échouer les tests de validation.
    if (typeof console !== 'undefined') console.warn('Entité inconnue :', spec.t);
    return null;
  }
  return new C(spec, world);
}

/* ── src/engine/World.js ─────────────────────────────────────────── */
/**
 * World — l'instance d'exécution d'un niveau.
 *
 * C'est le seul objet dont la physique dépend. Il ne connaît NI le DOM, NI le
 * canvas, NI l'audio : uniquement des données et du temps. Cette contrainte est
 * volontaire — elle permet de faire tourner un niveau en Node (voir tests/) et
 * donc de prouver automatiquement qu'il est franchissable.
 *
 * Les effets « sensibles » (son, vibration, particules) ne sont pas joués ici :
 * le monde les empile dans `events`, et la couche présentation les consomme.
 */
class World {
  /**
   * @param {object} level      définition déclarative (voir src/data/levels/)
   * @param {object} [opts]     { dash: bool } capacités débloquées
   */
  constructor(level, opts = {}) {
    this.level = level;
    this.w = (level.w ?? 26) * TILE;
    this.h = (level.h ?? 15) * TILE;
    this.opts = opts;
    this.rng = makeRng(level.seed ?? 1234);

    this.time = 0; // temps écoulé dans la tentative
    this.frame = 0;
    this.state = 'run'; // 'run' | 'dead' | 'win'
    this.deathKind = null;
    this.deathAt = null; // {x,y} pour l'explosion
    this.events = []; // file d'effets pour la présentation

    this.signals = new Map(); // nom -> booléen (état courant)
    this.pulses = new Set(); // signaux déclenchés sur CETTE frame
    // Mémoire persistante entre deux tentatives d'un même niveau. Elle est
    // fournie de l'extérieur : c'est ce qui permet à un mécanisme de se
    // souvenir de ce que le joueur a fait AVANT de mourir (niveau 26).
    this.memory = opts.memory instanceof Map ? opts.memory : new Map();

    this.entities = [];
    for (const spec of level.entities ?? []) {
      const e = createEntity(spec, this);
      if (e) {
        e.world = this;
        this.entities.push(e);
      }
    }

    // Index de travail (recalculés à chaque frame, sans allocation)
    this.solids = [];
    this.hazards = [];

    // `startAt` : réapparition sur un point de contrôle atteint lors d'une
    // tentative précédente (en pixels, pas en tuiles).
    const start = opts.startAt;
    this.player = start
      ? new Player(start.x, start.y, this)
      : new Player((level.spawn?.x ?? 2) * TILE, (level.spawn?.y ?? 10) * TILE, this);
    this.checkpoint = start || null;

    // Trace du joueur, utilisée par les clones (mécanique chapitre 5)
    this.trace = [];

    for (const e of this.entities) e.init?.(this);
    this.reindex();
  }

  // --- Signaux ---------------------------------------------------------------

  /** État courant d'un signal (faux par défaut). */
  isOn(name) {
    return name ? this.signals.get(name) === true : false;
  }

  /** Pose un signal. Émet une impulsion sur le front montant. */
  setSignal(name, value) {
    if (!name) return;
    const prev = this.signals.get(name) === true;
    this.signals.set(name, value === true);
    if (value === true && !prev) this.pulses.add(name);
  }

  /** Le signal a-t-il été déclenché sur cette frame ? */
  pulsed(name) {
    return this.pulses.has(name);
  }

  // --- Effets (consommés par la couche présentation) -------------------------

  fx(type, data) {
    this.events.push({ type, ...data });
  }

  drainEvents() {
    const out = this.events;
    this.events = [];
    return out;
  }

  // --- Cycle de vie ----------------------------------------------------------

  reindex() {
    this.solids.length = 0;
    this.hazards.length = 0;
    for (const e of this.entities) {
      if (e.active === false) continue;
      if (e.solid) this.solids.push(e);
      if (e.deadly) this.hazards.push(e);
    }
  }

  kill(kind = DEATH.BOOM, src = null) {
    if (this.state !== 'run') return;
    this.state = 'dead';
    this.deathKind = kind;
    this.deathAt = { x: this.player.cx, y: this.player.cy };
    this.player.dead = true;
    this.fx('death', { kind, x: this.player.cx, y: this.player.cy, src });
  }

  win() {
    if (this.state !== 'run') return;
    this.state = 'win';
    this.fx('win', { x: this.player.cx, y: this.player.cy });
  }

  /**
   * Un pas de simulation. `input` : { left, right, jump, jumpPressed, dash }
   * Toujours appelé avec FIXED_DT — jamais avec un delta variable.
   */
  step(input) {
    if (this.state !== 'run') return;
    this.pulses.clear();
    this.time += FIXED_DT;
    this.frame++;

    // 1) Les solides bougent en premier : ils portent ou poussent le joueur.
    // On met à jour TOUTES les entités, y compris désactivées — une dalle
    // effondrée doit continuer à compter le temps qui la fera réapparaître.
    // (Filtrer sur `active` ici gelait définitivement toute dalle disparue :
    // bug trouvé par le solveur, pas à l'œil.)
    for (const e of this.entities) e.preStep?.(this, FIXED_DT);
    this.reindex();

    // 2) Le joueur agit — sauf s'il vient d'être écrasé pendant l'étape 1.
    // Faire avancer un robot déjà mort le projette hors de la salle et fausse
    // la position de l'explosion.
    if (this.state === 'run') this.player.step(input, FIXED_DT);

    // 3) Interactions dépendant de la position finale du joueur.
    for (const e of this.entities) e.postStep?.(this, FIXED_DT);

    // 4) Dangers. Vérifiés en dernier pour que la hitbox soit exacte.
    if (this.state === 'run') this.checkHazards();

    // 5) Sortie de salle. Vers le bas c'est une chute ; vers le haut aussi,
    // parce qu'en gravité inversée le vide est en haut.
    if (this.state === 'run' && (this.player.y > this.h + 80 || this.player.y < -240)) {
      this.kill(DEATH.FALL);
    }

    // Trace pour les clones (1 point / frame, borné).
    if (this.trace.length < 60 * 90) {
      this.trace.push(this.player.x, this.player.y, input.left ? 1 : 0);
    }
  }

  checkHazards() {
    const p = this.player;
    // Hitbox de mort légèrement plus petite que la hitbox physique : le joueur
    // ne doit jamais mourir "à un pixel près" sur un frôlement.
    const hx = p.x + 3, hy = p.y + 3, hw = p.w - 6, hh = p.h - 6;
    for (const e of this.hazards) {
      const b = e.hazardBox ? e.hazardBox() : e;
      if (!b) continue;
      if (aabb(hx, hy, hw, hh, b.x, b.y, b.w, b.h)) {
        this.kill(e.deathKind || DEATH.ZAP, e);
        return;
      }
    }
  }

  /** Le rectangle donné touche-t-il un solide (hors `ignore`) ? */
  overlapsSolid(x, y, w, h, ignore = null) {
    for (const s of this.solids) {
      if (s === ignore) continue;
      if (aabb(x, y, w, h, s.x, s.y, s.w, s.h)) return s;
    }
    return null;
  }

  /**
   * Copie complète et indépendante de l'état de simulation.
   *
   * Sert exclusivement au solveur de validation (tests/) : explorer un arbre
   * d'actions impose de repartir d'un état donné sans tout resimuler. Les
   * données immuables (spec, trajectoires) sont partagées volontairement.
   */
  clone() {
    const nw = Object.create(World.prototype);
    Object.assign(nw, this);
    nw.signals = new Map(this.signals);
    nw.pulses = new Set(this.pulses);
    nw.memory = new Map(this.memory);
    nw.events = [];
    nw.trace = this.trace.slice();
    nw.entities = this.entities.map((e) => {
      const ne = Object.create(Object.getPrototypeOf(e));
      Object.assign(ne, e);
      ne.world = nw;
      if (e.beam) ne.beam = { ...e.beam };
      if (e.trace === this.trace) ne.trace = nw.trace;
      return ne;
    });
    nw.player = Object.create(Object.getPrototypeOf(this.player));
    Object.assign(nw.player, this.player);
    nw.player.world = nw;
    nw.solids = [];
    nw.hazards = [];
    nw.reindex();
    return nw;
  }

  /** Première entité d'un type donné (utilitaire de level design). */
  find(type) {
    return this.entities.find((e) => e.type === type) || null;
  }

  findAll(type) {
    return this.entities.filter((e) => e.type === type);
  }
}

const CHAPTERS = [CHAPTER_1, CHAPTER_2, CHAPTER_3, CHAPTER_4, CHAPTER_5];

/**
 * Normalisation : c'est ici, et nulle part ailleurs, qu'un niveau écrit à la
 * main devient un niveau exécutable.
 *
 * Ajouter les murs de bordure automatiquement évite de répéter trois entités
 * dans chacun des trente niveaux — et surtout évite l'oubli, qui produirait un
 * bug de sortie de salle très difficile à diagnostiquer.
 */
function normalize(level, chapter, indexInChapter, globalIndex) {
  const w = level.w ?? 26;
  const h = level.h ?? 15;
  return {
    ...level,
    w, h,
    id: `c${chapter.id}-${String(indexInChapter + 1).padStart(2, '0')}`,
    num: globalIndex + 1,
    chapterId: chapter.id,
    chapterName: chapter.name,
    palette: chapter.palette,
    dash: chapter.dash === true,
    entities: [
      // Murs latéraux : on ne sort jamais d'une salle par le côté.
      { t: 'solid', x: -2, y: -30, w: 2, h: h + 60, style: 'bound' },
      { t: 'solid', x: w, y: -30, w: 2, h: h + 60, style: 'bound' },
      ...level.entities,
    ],
  };
}

/** Liste à plat des 30 niveaux, dans l'ordre de progression. */
const LEVELS = (() => {
  const out = [];
  for (const ch of CHAPTERS) {
    ch.levels.forEach((lv, i) => out.push(normalize(lv, ch, i, out.length)));
  }
  return out;
})();

const LEVEL_COUNT = LEVELS.length;

function getLevel(num) {
  return LEVELS[num - 1] || null;
}

function chapterOf(num) {
  const lv = getLevel(num);
  return lv ? CHAPTERS.find((c) => c.id === lv.chapterId) : null;
}

/** Index (base 1) du premier niveau de chaque chapitre. */
function chapterRanges() {
  const ranges = [];
  let start = 1;
  for (const ch of CHAPTERS) {
    ranges.push({ chapter: ch, from: start, to: start + ch.levels.length - 1 });
    start += ch.levels.length;
  }
  return ranges;
}

/** Un skin est-il débloqué au vu des statistiques du joueur ? */
function isSkinUnlocked(skin, stats) {
  const u = skin.unlock;
  if (!u) return true;
  switch (u.type) {
    case 'deaths': return stats.totalDeaths >= u.value;
    case 'levels': return stats.completedCount >= u.value;
    case 'fastLevel': return stats.bestTimeAny > 0 && stats.bestTimeAny < u.value;
    case 'noDeathStreak': return stats.bestCleanStreak >= u.value;
    case 'secrets': return stats.secrets >= u.value;
    case 'chapter': return stats.maxChapter >= u.value;
    default: return false;
  }
}

/**
 * @param {object} ctx { attempt, totalDeaths, nearExit, rng }
 * @returns {string|null} message, ou null pour redémarrer en silence
 */
function pickQuip(ctx) {
  if (TOTAL_MILESTONE[ctx.totalDeaths]) return TOTAL_MILESTONE[ctx.totalDeaths];
  if (MILESTONE[ctx.attempt]) return MILESTONE[ctx.attempt];
  const r = ctx.rng();
  if (ctx.nearExit && r < 0.55) return CLOSE[Math.floor(r * 1000) % CLOSE.length];
  // ~18 % des morts « ordinaires » sont commentées. Au-delà, ça lasse.
  if (r < 0.18) return GENERIC[Math.floor(r * 10000) % GENERIC.length];

 *

 * trahi : c'est le seul cas où le jeu est en tort.

/** Variantes d'ambiance par chapitre — même charte, autre température. */
const PALETTES = {
  station: { bg0: '#0b0d20', bg1: '#171b3d', grid: 'rgba(123,92,255,0.10)', haze: 'rgba(63,232,255,0.05)' },
  lab: { bg0: '#0a1226', bg1: '#123049', grid: 'rgba(63,232,255,0.10)', haze: 'rgba(63,232,255,0.07)' },
  grav: { bg0: '#140b26', bg1: '#2a1650', grid: 'rgba(163,120,255,0.12)', haze: 'rgba(163,120,255,0.06)' },
  core: { bg0: '#1a0d16', bg1: '#3a1526', grid: 'rgba(255,138,61,0.09)', haze: 'rgba(255,138,61,0.06)' },
  void: { bg0: '#06060e', bg1: '#12102a', grid: 'rgba(255,255,255,0.05)', haze: 'rgba(123,92,255,0.05)' },

function palette(name) {
  return PALETTES[name] || PALETTES.station;
}

/** Rectangle arrondi — la primitive de base de tout le rendu. */
function roundRect(ctx, x, y, w, h, r) {
  const rr = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.arcTo(x + w, y, x + w, y + h, rr);
  ctx.arcTo(x + w, y + h, x, y + h, rr);
  ctx.arcTo(x, y + h, x, y, rr);
  ctx.arcTo(x, y, x + w, y, rr);
  ctx.closePath();
}

/**
 * Halo lumineux. `shadowBlur` est coûteux sur mobile : on l'active par petites
 * zones seulement, jamais sur un remplissage plein écran.
 */
function glow(ctx, color, blur, draw) {
  ctx.save();
  ctx.shadowColor = color;
  ctx.shadowBlur = blur;
  draw();
  ctx.restore();
}

/* ── src/render/Robot.js ─────────────────────────────────────────── */
/**
 * Le robot.
 *
 * Entièrement vectoriel, dessiné image par image : aucun sprite, aucune
 * feuille d'animation. C'est ce qui permet huit skins pour zéro octet d'assets
 * et une netteté parfaite de 480p à 1440p.
 *
 * Toute l'expressivité passe par UN écran facial. Le corps ne fait que se
 * déformer (squash & stretch) ; c'est le visage qui raconte. Un robot qui a
 * l'air surpris une demi-seconde avant de mourir transforme une punition en
 * gag — et un gag, on veut le revoir.
 */

const EYES = {
  //         forme      espacement  hauteur
  normal: { shape: 'dot', gap: 5.2, y: 0, size: 2.3 },
  happy: { shape: 'arc', gap: 5.4, y: 0.5, size: 2.6 },
  surprise: { shape: 'ring', gap: 5.6, y: -0.2, size: 3.0 },
  focus: { shape: 'bar', gap: 5.2, y: 0.2, size: 2.2 },
  worry: { shape: 'small', gap: 5.0, y: 0.6, size: 1.7 },
  dead: { shape: 'cross', gap: 5.4, y: 0, size: 2.8 },
  zap: { shape: 'spiral', gap: 5.4, y: 0, size: 2.7 },
};

/** Quel visage pour quel état ? C'est toute la mise en scène du personnage. */
function faceFor(state) {
  switch (state) {
    case 'run': return 'focus';
    case 'jump': return 'surprise';
    case 'fall': return 'worry';
    case 'dash': return 'focus';
    case 'win': return 'happy';
    case 'dead': return 'dead';
    case 'zap': return 'zap';
    default: return 'normal';
  }
}

function drawEye(ctx, x, y, e, color, blink) {
  ctx.fillStyle = color;
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.4;
  ctx.lineCap = 'round';
  if (blink) {
    ctx.beginPath();
    ctx.moveTo(x - e.size, y);
    ctx.lineTo(x + e.size, y);
    ctx.stroke();
    return;
  }
  switch (e.shape) {
    case 'arc':
      ctx.beginPath();
      ctx.arc(x, y + e.size * 0.5, e.size, Math.PI * 1.15, Math.PI * 1.85);
      ctx.stroke();
      break;
    case 'ring':
      ctx.beginPath();
      ctx.arc(x, y, e.size, 0, Math.PI * 2);
      ctx.stroke();
      break;
    case 'bar':
      roundRect(ctx, x - e.size * 0.75, y - e.size * 0.5, e.size * 1.5, e.size, 1);
      ctx.fill();
      break;
    case 'small':
      ctx.beginPath();
      ctx.arc(x, y, e.size * 0.8, 0, Math.PI * 2);
      ctx.fill();
      break;
    case 'cross':
      ctx.beginPath();
      ctx.moveTo(x - e.size, y - e.size);
      ctx.lineTo(x + e.size, y + e.size);
      ctx.moveTo(x + e.size, y - e.size);
      ctx.lineTo(x - e.size, y + e.size);
      ctx.stroke();
      break;
    case 'spiral':
      ctx.beginPath();
      for (let a = 0; a < Math.PI * 3.2; a += 0.28) {
        const r = (a / (Math.PI * 3.2)) * e.size;
        const px = x + Math.cos(a) * r;
        const py = y + Math.sin(a) * r;
        a === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
      }
      ctx.stroke();
      break;
    default:
      ctx.beginPath();
      ctx.arc(x, y, e.size, 0, Math.PI * 2);
      ctx.fill();
  }
}

/**
 * @param {CanvasRenderingContext2D} ctx
 * @param {object} o { x, y (centre), skin, state, facing, squash, t, alpha }
 */
function drawRobot(ctx, o) {
  const skin = o.skin;
  const scale = (skin.scale ?? 1) * (o.scale ?? 1);
  const R = 11 * scale;
  const sq = o.squash || 0;
  // Squash & stretch : volume constant, sinon le robot « respire » faux.
  const sx = 1 + sq * 0.35;
  const sy = 1 - sq * 0.35;
  const face = EYES[faceFor(o.state)] || EYES.normal;
  const t = o.t || 0;
  // Clignement : toutes les ~3,4 s, très court. Détail invisible mais c'est ce
  // qui fait qu'on trouve le robot « vivant ».
  const blink = o.state !== 'dead' && (t % 3.4) < 0.11;

  ctx.save();
  ctx.globalAlpha = o.alpha ?? 1;
  ctx.translate(o.x, o.y);
  if (o.roll) ctx.rotate(o.roll);
  ctx.scale(sx * (o.facing < 0 ? -1 : 1), sy);

  // Ombre portée douce au sol
  if (o.groundY != null) {
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = 0.25 * (o.alpha ?? 1);
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.ellipse(o.x, o.groundY, R * 0.9, R * 0.28, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // Corps
  const g = ctx.createLinearGradient(0, -R, 0, R);
  g.addColorStop(0, skin.shell);
  g.addColorStop(1, skin.shell2);
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(0, 0, R, 0, Math.PI * 2);
  ctx.fill();

  if (skin.stripes) {
    ctx.save();
    ctx.clip();
    ctx.fillStyle = 'rgba(30,30,30,0.55)';
    for (let i = -2; i <= 2; i++) {
      ctx.save();
      ctx.rotate(-0.6);
      ctx.fillRect(i * 5 * scale - 1.2, -R * 1.4, 2.4, R * 2.8);
      ctx.restore();
    }
    ctx.restore();
  }

  // Liseré lumineux
  ctx.strokeStyle = skin.trim;
  ctx.globalAlpha = (o.alpha ?? 1) * 0.85;
  ctx.lineWidth = 1.3;
  ctx.beginPath();
  ctx.arc(0, 0, R - 0.7, 0, Math.PI * 2);
  ctx.stroke();
  ctx.globalAlpha = o.alpha ?? 1;

  // Antenne
  if (skin.antenna && skin.antenna !== 'none') {
    ctx.strokeStyle = skin.shell2;
    ctx.lineWidth = 1.6;
    const bob = Math.sin(t * 6) * 0.8 * (o.state === 'run' ? 1 : 0.25);
    if (skin.antenna === 'twin') {
      for (const s of [-1, 1]) {
        ctx.beginPath();
        ctx.moveTo(s * 4 * scale, -R + 1);
        ctx.lineTo(s * 6 * scale, -R - 4 * scale + bob);
        ctx.stroke();
        ctx.fillStyle = skin.trim;
        ctx.beginPath();
        ctx.arc(s * 6 * scale, -R - 4 * scale + bob, 1.6 * scale, 0, Math.PI * 2);
        ctx.fill();
      }
    } else {
      const len = skin.antenna === 'rod' ? 6 : 3;
      ctx.beginPath();
      ctx.moveTo(0, -R + 1);
      ctx.lineTo(bob, -R - len * scale);
      ctx.stroke();
      ctx.fillStyle = skin.trim;
      ctx.beginPath();
      ctx.arc(bob, -R - len * scale, 1.8 * scale, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // Écran facial
  const sw = R * 1.35;
  const sh = R * 0.95;
  ctx.fillStyle = skin.screen;
  roundRect(ctx, -sw / 2, -sh / 2 - R * 0.06, sw, sh, 3.4 * scale);
  ctx.fill();

  // Yeux
  ctx.save();
  ctx.shadowColor = skin.eye;
  ctx.shadowBlur = 6;
  const ey = face.y * scale - R * 0.06;
  drawEye(ctx, -face.gap * 0.5 * scale, ey, { ...face, size: face.size * scale }, skin.eye, blink);
  drawEye(ctx, face.gap * 0.5 * scale, ey, { ...face, size: face.size * scale }, skin.eye, blink);
  ctx.restore();

  // Bouche : une seule courbe, seulement quand elle apporte quelque chose.
  if (o.state === 'win' || o.state === 'fall') {
    ctx.strokeStyle = skin.eye;
    ctx.lineWidth = 1.1;
    ctx.beginPath();
    const my = ey + 4.2 * scale;
    if (o.state === 'win') ctx.arc(0, my - 1.5 * scale, 2.4 * scale, 0.15 * Math.PI, 0.85 * Math.PI);
    else ctx.arc(0, my + 1.6 * scale, 2.2 * scale, 1.15 * Math.PI, 1.85 * Math.PI);
    ctx.stroke();
  }
