  if (skin.cracked) {
    ctx.strokeStyle = 'rgba(255,255,255,0.55)';
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.moveTo(-sw * 0.4, -sh * 0.4);
    ctx.lineTo(-sw * 0.1, 0);
    ctx.lineTo(-sw * 0.25, sh * 0.35);
    ctx.moveTo(-sw * 0.1, 0);
    ctx.lineTo(sw * 0.35, -sh * 0.15);
    ctx.stroke();
  }

  if (skin.shine) {
    ctx.globalAlpha = (o.alpha ?? 1) * 0.5;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.ellipse(-R * 0.42, -R * 0.5, R * 0.22, R * 0.12, -0.7, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.restore();
}

/** Portrait statique pour les menus (sélection de robot). */
function drawRobotPortrait(ctx, x, y, skin, scale, t, state = 'idle') {
  drawRobot(ctx, { x, y, skin, state, facing: 1, squash: Math.sin(t * 2) * 0.05, t, scale });
}

const ROBOT_COLORS = C;

/* ── src/render/Renderer.js ──────────────────────────────────────── */
/**
 * Rendu de la salle.
 *
 * Contraintes mobiles qui dictent toute l'implémentation :
 *  - un seul canvas, un seul contexte, aucune texture ;
 *  - `shadowBlur` réservé aux petits éléments (sortie, faisceaux, robot) ;
 *  - le fond est redessiné à plat, sans blur plein écran ;
 *  - rien n'est dessiné hors du champ de la caméra.
 * Résultat : 60 FPS tenus sur un mobile d'entrée de gamme.
 */
class Renderer {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d', { alpha: false, desynchronized: true });
    this.t = 0;
    this.quality = 1; // 1 = complet, 0 = économe (baissé automatiquement)
  }

  /**
   * Le fond : dégradé, grille en parallaxe, brume.
   * Peint sur TOUT le canevas (débord compris), pas seulement sur la boîte de
   * jeu — c'est ce qui fait qu'un ratio d'écran inattendu produit un cadrage
   * et non deux bandes noires. Zéro allocation par frame.
   */
  drawBackground(view, cam, pal) {
    const ctx = this.ctx;
    const x0 = -(view.padX || 0);
    const y0 = -(view.padY || 0);
    const w = view.fullW || view.w;
    const h = view.fullH || view.h;
    const g = ctx.createLinearGradient(0, y0, 0, y0 + h);
    g.addColorStop(0, pal.bg0);
    g.addColorStop(1, pal.bg1);
    ctx.fillStyle = g;
    ctx.fillRect(x0, y0, w, h);

    // Grille lointaine — parallaxe 0,35 : elle donne la vitesse sans distraire.
    const step = 48;
    const ox = x0 - ((cam.x * 0.35) % step);
    const oy = y0 - ((cam.y * 0.35) % step);
    ctx.strokeStyle = pal.grid;
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = ox; x < x0 + w + step; x += step) {
      ctx.moveTo(Math.round(x) + 0.5, y0);
      ctx.lineTo(Math.round(x) + 0.5, y0 + h);
    }
    for (let y = oy; y < y0 + h + step; y += step) {
      ctx.moveTo(x0, Math.round(y) + 0.5);
      ctx.lineTo(x0 + w, Math.round(y) + 0.5);
    }
    ctx.stroke();

    if (this.quality > 0) {
      const cx = view.w * 0.5;
      const cy = view.h * 0.45;
      const hz = ctx.createRadialGradient(cx, cy, 10, cx, cy, view.w * 0.7);
      hz.addColorStop(0, pal.haze);
      hz.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = hz;
      ctx.fillRect(x0, y0, w, h);
    }
  }

  // --- Pièces du décor -------------------------------------------------------

  drawSolid(e) {
    const ctx = this.ctx;
    if (e.style === 'bound') return; // les murs de bordure restent invisibles
    const g = ctx.createLinearGradient(0, e.y, 0, e.y + e.h);
    g.addColorStop(0, C.wallLit);
    g.addColorStop(0.18, C.wall);
    g.addColorStop(1, '#1a1f42');
    ctx.fillStyle = g;
    roundRect(ctx, e.x, e.y, e.w, e.h, 3);
    ctx.fill();
    // Arête supérieure : c'est elle qui rend le sol lisible d'un coup d'œil.
    ctx.fillStyle = C.wallEdge;
    ctx.fillRect(e.x + 1.5, e.y, e.w - 3, 2);
  }

  drawCrumble(e) {
    const ctx = this.ctx;
    const shake = e.shake || 0;
    const dx = shake ? (Math.random() - 0.5) * shake * 2.4 : 0;
    ctx.save();
    ctx.globalAlpha = e.active ? 1 : 0.14;
    ctx.translate(dx, 0);
    ctx.fillStyle = e.active ? '#2c2f5c' : '#191c38';
    roundRect(ctx, e.x, e.y, e.w, e.h, 2);
    ctx.fill();
    ctx.strokeStyle = shake > 0.3 ? C.danger : '#4a4f8c';
    ctx.lineWidth = 1;
    ctx.stroke();
    // Fissures : elles s'ouvrent avec le compte à rebours.
    if (e.active) {
      ctx.strokeStyle = `rgba(255,138,61,${0.15 + shake * 0.75})`;
      ctx.lineWidth = 0.9;
      ctx.beginPath();
      ctx.moveTo(e.x + e.w * 0.2, e.y);
      ctx.lineTo(e.x + e.w * 0.45, e.y + e.h * 0.6);
      ctx.lineTo(e.x + e.w * 0.3, e.y + e.h);
      ctx.moveTo(e.x + e.w * 0.7, e.y);
      ctx.lineTo(e.x + e.w * 0.6, e.y + e.h * 0.5);
      ctx.stroke();
    }
    ctx.restore();
  }

  drawVanish(e) {
    const ctx = this.ctx;
    ctx.save();
    ctx.globalAlpha = Math.max(0.12, e.alpha);
    ctx.fillStyle = 'rgba(63,232,255,0.20)';
    roundRect(ctx, e.x, e.y, e.w, e.h, 3);
    ctx.fill();
    ctx.strokeStyle = C.cyan;
    ctx.lineWidth = 1.2;
    ctx.stroke();
    ctx.restore();
  }

  drawGhost(e) {
    const ctx = this.ctx;
    const v = e.vis ?? 0;
    if (v < 0.02) return;
    ctx.save();
    ctx.globalAlpha = v * 0.85;
    ctx.fillStyle = 'rgba(160,190,255,0.18)';
    roundRect(ctx, e.x, e.y, e.w, e.h, 3);
    ctx.fill();
    ctx.setLineDash([4, 4]);
    ctx.strokeStyle = 'rgba(200,220,255,0.9)';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.restore();
  }

  drawMover(e) {
    const ctx = this.ctx;
    if (e.style === 'saw') {
      const cx = e.x + e.w / 2;
      const cy = e.y + e.h / 2;
      const r = Math.max(e.w, e.h) * 0.62;
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(this.t * 9);
      ctx.fillStyle = C.danger;
      ctx.beginPath();
      for (let i = 0; i < 8; i++) {
        const a = (i / 8) * Math.PI * 2;
        ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
        const b = a + Math.PI / 8;
        ctx.lineTo(Math.cos(b) * r * 0.62, Math.sin(b) * r * 0.62);
      }
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = C.dangerDeep;
      ctx.beginPath();
      ctx.arc(0, 0, r * 0.3, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
      return;
    }
    const g = ctx.createLinearGradient(0, e.y, 0, e.y + e.h);
    g.addColorStop(0, e.style === 'loose' ? '#5a4a2e' : '#2f3a72');
    g.addColorStop(1, e.style === 'loose' ? '#3a2f1d' : '#1d2450');
    ctx.fillStyle = g;
    roundRect(ctx, e.x, e.y, e.w, e.h, 3);
    ctx.fill();
    ctx.fillStyle = e.style === 'loose' ? C.gold : C.cyan;
    ctx.fillRect(e.x + 2, e.y, e.w - 4, 1.8);
  }

  drawDoor(e) {
    const ctx = this.ctx;
    ctx.fillStyle = '#39407a';
    roundRect(ctx, e.x, e.y, e.w, e.h, 2);
    ctx.fill();
    ctx.strokeStyle = C.cyanDim;
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.fillStyle = 'rgba(63,232,255,0.35)';
    for (let i = 1; i < 4; i++) {
      ctx.fillRect(e.x + 2, e.y + (e.h * i) / 4, e.w - 4, 1);
    }
  }

  drawCrusher(e) {
    const ctx = this.ctx;
    const g = ctx.createLinearGradient(0, e.y, 0, e.y + e.h);
    g.addColorStop(0, '#4a3050');
    g.addColorStop(1, '#2a1b30');
    ctx.fillStyle = g;
    roundRect(ctx, e.x, e.y, e.w, e.h, 3);
    ctx.fill();
    // Bandes d'avertissement : elles virent au rouge pendant la frappe.
    const warn = e.phase === 'strike' || e.phase === 'hold';
    ctx.fillStyle = warn ? C.alert : C.danger;
    ctx.save();
    ctx.beginPath();
    ctx.rect(e.x, e.y + e.h - 5, e.w, 5);
    ctx.clip();
    for (let i = -1; i < e.w / 8 + 1; i++) {
      ctx.beginPath();
      ctx.moveTo(e.x + i * 8, e.y + e.h);
      ctx.lineTo(e.x + i * 8 + 4, e.y + e.h - 5);
      ctx.lineTo(e.x + i * 8 + 8, e.y + e.h - 5);
      ctx.lineTo(e.x + i * 8 + 4, e.y + e.h);
      ctx.fill();
    }
    ctx.restore();
  }

  drawZap(e) {
    const ctx = this.ctx;
    if (!e.deadly) {
      ctx.globalAlpha = 0.28;
    }
    const up = e.dir !== 'down';
    ctx.fillStyle = C.dangerDeep;
    roundRect(ctx, e.x, e.y, e.w, e.h, 1.5);
    ctx.fill();
    // Arcs électriques : déterministes en position, animés en intensité.
    ctx.strokeStyle = C.danger;
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    const n = Math.max(2, Math.floor(e.w / 9));
    for (let i = 0; i <= n; i++) {
      const x = e.x + (e.w * i) / n;
      const wob = Math.sin(this.t * 14 + i * 1.7) * 2.4;
      const y = up ? e.y - 1 : e.y + e.h + 1;
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y + (up ? -Math.abs(wob) : Math.abs(wob)));
    }
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  drawLaser(e) {
    const ctx = this.ctx;
    // Émetteur
    ctx.fillStyle = '#3a4380';
    roundRect(ctx, e.x, e.y, e.w, e.h, 2);
    ctx.fill();
    const lens = e.on ? C.danger : (e.charging ? C.alert : '#5a63a8');
    ctx.fillStyle = lens;
    ctx.beginPath();
    ctx.arc(e.x + e.w / 2, e.y + e.h / 2, 2.4, 0, Math.PI * 2);
    ctx.fill();

    // Pré-signal : le point rouge annonce le tir. C'est ce qui fait la
    // différence entre un piège et une injustice.
    if (e.charging && !e.on) {
      ctx.save();
      ctx.globalAlpha = 0.5 + Math.sin(this.t * 30) * 0.3;
      ctx.strokeStyle = C.alert;
      ctx.setLineDash([3, 5]);
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(e.beam.x, e.beam.y + e.beam.h / 2);
      ctx.lineTo(e.beam.x + e.beam.w, e.beam.y + e.beam.h / 2);
      ctx.stroke();
      ctx.restore();
    }

    if (!e.on) return;
    const b = e.beam;
    ctx.save();
    ctx.shadowColor = C.danger;
    ctx.shadowBlur = 12;
    ctx.fillStyle = 'rgba(255,138,61,0.35)';
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.fillStyle = '#fff3e6';
    const core = 1.6;
    if (b.w > b.h) ctx.fillRect(b.x, b.y + b.h / 2 - core / 2, b.w, core);
    else ctx.fillRect(b.x + b.w / 2 - core / 2, b.y, core, b.h);
    ctx.restore();
  }

  drawExit(e) {
    const ctx = this.ctx;
    const cx = e.x + e.w / 2;
    // Une fausse sortie a un halo qui vacille très légèrement. Invisible la
    // première fois, évident la deuxième : c'est exactement le contrat.
    const unstable = e.fake ? 0.16 * Math.sin(this.t * 17.3) + 0.08 * Math.sin(this.t * 6.1) : 0;
    const open = e.requires ? e.open : 1;
    ctx.save();
    ctx.shadowColor = C.cyan;
    ctx.shadowBlur = 16 + Math.sin(this.t * 2.4) * 4;
    ctx.fillStyle = `rgba(63,232,255,${(0.10 + open * 0.16 + unstable).toFixed(3)})`;
    roundRect(ctx, e.x - 3, e.y - 3, e.w + 6, e.h + 6, 6);
    ctx.fill();
    ctx.restore();

    ctx.fillStyle = '#0d1638';
    roundRect(ctx, e.x, e.y, e.w, e.h, 4);
    ctx.fill();
    ctx.strokeStyle = open > 0.5 ? C.cyan : C.alert;
    ctx.lineWidth = 1.6;
    ctx.stroke();

    // Trait lumineux qui monte dans l'encadrement
    const p = (this.t * 0.45 + (e.x % 7) / 7) % 1;
    ctx.save();
    ctx.globalAlpha = 0.75 * open;
    ctx.fillStyle = C.cyan;
    ctx.fillRect(e.x + 3, e.y + e.h - p * e.h, e.w - 6, 2);
    ctx.restore();

    ctx.fillStyle = `rgba(234,246,255,${0.5 + open * 0.4})`;
    ctx.font = '600 7px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('SORTIE', cx, e.y - 6);
  }

  drawButton(e) {
    const ctx = this.ctx;
    const dz = e.press * 2.2;
    ctx.fillStyle = '#2a2f5e';
    roundRect(ctx, e.x - 2, e.y + e.h - 1, e.w + 4, 4, 1.5);
    ctx.fill();
    ctx.fillStyle = e.latched || e.pressed ? C.cyan : '#8f9ad6';
    roundRect(ctx, e.x, e.y + dz, e.w, e.h, 2);
    ctx.fill();
  }

  drawCheck(e) {
    const ctx = this.ctx;
    ctx.fillStyle = '#2a2f5e';
    ctx.fillRect(e.x + e.w / 2 - 1.2, e.y, 2.4, e.h);
    const on = e.taken;
    ctx.save();
    if (on) { ctx.shadowColor = C.cyan; ctx.shadowBlur = 10; }
    ctx.fillStyle = on ? C.cyan : '#6f79b8';
    ctx.beginPath();
    ctx.moveTo(e.x + e.w / 2 + 1, e.y + 1);
    ctx.lineTo(e.x + e.w / 2 + 10, e.y + 4.5);
    ctx.lineTo(e.x + e.w / 2 + 1, e.y + 8);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  drawTele(e) {
    const ctx = this.ctx;
    const broken = e.spec.broken === true;
    const col = broken ? '#8a5cff' : C.cyan;
    ctx.save();
    ctx.shadowColor = col;
    ctx.shadowBlur = broken ? 5 : 12;
    ctx.fillStyle = broken ? 'rgba(138,92,255,0.25)' : 'rgba(63,232,255,0.3)';
    roundRect(ctx, e.x, e.y, e.w, e.h, 3);
    ctx.fill();
    ctx.restore();
    ctx.strokeStyle = col;
    ctx.lineWidth = 1.2;
    ctx.setLineDash(broken ? [3, 3] : []);
    roundRect(ctx, e.x, e.y, e.w, e.h, 3);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  drawGrav(e) {
    const ctx = this.ctx;
    ctx.save();
    ctx.globalAlpha = 0.22 + Math.sin(this.t * 3) * 0.05;
    const g = ctx.createLinearGradient(e.x, 0, e.x + e.w, 0);
    g.addColorStop(0, 'rgba(123,92,255,0)');
    g.addColorStop(0.5, 'rgba(163,120,255,0.85)');
    g.addColorStop(1, 'rgba(123,92,255,0)');
    ctx.fillStyle = g;
    ctx.fillRect(e.x, e.y, e.w, e.h);
    ctx.restore();
    // Chevrons qui défilent : ils indiquent le sens de renversement.
    ctx.strokeStyle = 'rgba(200,180,255,0.8)';
    ctx.lineWidth = 1.2;
    const cx = e.x + e.w / 2;
    for (let i = 0; i < 4; i++) {
      const p = ((this.t * 0.6 + i / 4) % 1);
      const y = e.y + e.h - p * e.h;
      ctx.globalAlpha = Math.sin(p * Math.PI);
      ctx.beginPath();
      ctx.moveTo(cx - 5, y + 4);
      ctx.lineTo(cx, y);
      ctx.lineTo(cx + 5, y + 4);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  drawFan(e) {
    const ctx = this.ctx;
    ctx.save();
    ctx.globalAlpha = e.on ? 0.20 : 0.05;
    const vertical = e.dir === 'up' || e.dir === 'down';
    const g = vertical
      ? ctx.createLinearGradient(0, e.y, 0, e.y + e.h)
      : ctx.createLinearGradient(e.x, 0, e.x + e.w, 0);
    const a = 'rgba(63,232,255,0.55)';
    const b = 'rgba(63,232,255,0)';
    g.addColorStop(0, e.dir === 'up' || e.dir === 'left' ? b : a);
    g.addColorStop(1, e.dir === 'up' || e.dir === 'left' ? a : b);
    ctx.fillStyle = g;
    ctx.fillRect(e.x, e.y, e.w, e.h);
    ctx.restore();
    if (!e.on) return;
    ctx.strokeStyle = 'rgba(180,240,255,0.55)';
    ctx.lineWidth = 1;
    for (let i = 0; i < 5; i++) {
      const p = ((this.t * 1.3 + i / 5) % 1);
      ctx.globalAlpha = Math.sin(p * Math.PI) * 0.8;
      ctx.beginPath();
      if (vertical) {
        const y = e.dir === 'up' ? e.y + e.h - p * e.h : e.y + p * e.h;
        const x = e.x + ((i * 37) % e.w);
        ctx.moveTo(x, y);
        ctx.lineTo(x, y + (e.dir === 'up' ? 8 : -8));
      } else {
        const x = e.dir === 'left' ? e.x + e.w - p * e.w : e.x + p * e.w;
        const y = e.y + ((i * 29) % e.h);
        ctx.moveTo(x, y);
        ctx.lineTo(x + (e.dir === 'left' ? 8 : -8), y);
      }
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  drawField(e) {
    const ctx = this.ctx;
    // La couleur dit la vérité : un champ qui attire vers un danger est
    // orange, un champ inoffensif est cyan. Le joueur peut donc décider AVANT
    // d'y entrer — la surprise vient d'ailleurs.
    const col = e.kind === 'magnet'
      ? (e.spec.hostile ? 'rgba(255,138,61,' : 'rgba(63,232,255,')
      : e.kind === 'fast' ? 'rgba(255,209,102,' : e.kind === 'ice' ? 'rgba(150,220,255,' : 'rgba(123,92,255,';
    ctx.save();
    ctx.fillStyle = col + '0.10)';
    ctx.fillRect(e.x, e.y, e.w, e.h);
    ctx.strokeStyle = col + '0.45)';
    ctx.setLineDash([5, 5]);
    ctx.lineWidth = 1;
    ctx.strokeRect(e.x + 0.5, e.y + 0.5, e.w - 1, e.h - 1);
    ctx.setLineDash([]);
    if (e.kind === 'magnet') {
      const ax = e.anchor ? e.spec.anchor[0] * TILE : e.x + e.w / 2;
      const ay = e.anchor ? e.spec.anchor[1] * TILE : e.y + e.h / 2;
      ctx.strokeStyle = col + '0.5)';
      for (let i = 0; i < 3; i++) {
        const r = 8 + ((this.t * 22 + i * 16) % 46);
        ctx.globalAlpha = 1 - r / 46;
        ctx.beginPath();
        ctx.arc(ax, ay, r, 0, Math.PI * 2);
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  drawSign(e) {
    const ctx = this.ctx;
    const v = e.vis;
    if (v < 0.03) return;
    ctx.save();
    ctx.globalAlpha = v;
    ctx.fillStyle = 'rgba(8,12,32,0.82)';
    roundRect(ctx, e.x, e.y, e.w, e.h, 3);
    ctx.fill();
    ctx.strokeStyle = 'rgba(63,232,255,0.5)';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.fillStyle = C.cyan;
    ctx.font = '600 6.5px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const lines = e.text.split('\n');
    lines.forEach((ln, i) => {
      ctx.fillText(ln, e.x + e.w / 2, e.y + e.h / 2 + (i - (lines.length - 1) / 2) * 8);
    });
    ctx.restore();
  }

  drawDeco(e) {
    const ctx = this.ctx;
    switch (e.kind) {
      case 'lamp': {
        const on = e.spec.signal ? e.world.isOn(e.spec.signal) : false;
        ctx.save();
        if (on) { ctx.shadowColor = '#5dff9b'; ctx.shadowBlur = 12; }
        ctx.fillStyle = on ? '#5dff9b' : '#4a2030';
        ctx.beginPath();
        ctx.arc(e.x + e.w / 2, e.y + e.h / 2, e.w / 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        break;
      }
      case 'crate':
        ctx.fillStyle = '#33397a';
        roundRect(ctx, e.x, e.y, e.w, e.h, 2);
        ctx.fill();
        ctx.strokeStyle = '#5a63a8';
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(e.x, e.y);
        ctx.lineTo(e.x + e.w, e.y + e.h);
        ctx.moveTo(e.x + e.w, e.y);
        ctx.lineTo(e.x, e.y + e.h);
        ctx.stroke();
        break;
      case 'bolt':
        ctx.fillStyle = C.gold;
        ctx.beginPath();
        ctx.arc(e.x + e.w / 2, e.y + e.h / 2, e.w / 2, 0, Math.PI * 2);
        ctx.fill();
        break;
      case 'stripe': {
        ctx.save();
        ctx.beginPath();
        ctx.rect(e.x, e.y, e.w, e.h);
        ctx.clip();
        ctx.fillStyle = C.danger;
        for (let i = -1; i < e.w / 8 + 1; i++) {
          ctx.beginPath();
          ctx.moveTo(e.x + i * 8, e.y + e.h);
          ctx.lineTo(e.x + i * 8 + 4, e.y);
          ctx.lineTo(e.x + i * 8 + 8, e.y);
          ctx.lineTo(e.x + i * 8 + 4, e.y + e.h);
          ctx.fill();
        }
        ctx.restore();
        break;
      }
      case 'grid':
        ctx.strokeStyle = '#5a63a8';
        ctx.lineWidth = 1;
        for (let x = e.x + 2; x < e.x + e.w; x += 4) {
          ctx.beginPath();
          ctx.moveTo(x, e.y);
          ctx.lineTo(x, e.y + e.h);
          ctx.stroke();
        }
        break;
      case 'pipe':
      case 'rail':
        ctx.fillStyle = '#2b3160';
        roundRect(ctx, e.x, e.y, e.w, e.h, e.h / 2);
        ctx.fill();
        break;
      case 'vent':
        ctx.fillStyle = '#1c2148';
        roundRect(ctx, e.x, e.y, e.w, e.h, 2);
        ctx.fill();
        ctx.strokeStyle = '#4a5290';
        for (let i = 1; i < 4; i++) {
          ctx.beginPath();
          ctx.moveTo(e.x + 2, e.y + (e.h * i) / 4);
          ctx.lineTo(e.x + e.w - 2, e.y + (e.h * i) / 4);
          ctx.stroke();
        }
        break;
      case 'gift':
      case 'core': {
        ctx.save();
        ctx.shadowColor = C.gold;
        ctx.shadowBlur = 10 + Math.sin(this.t * 3) * 4;
        ctx.fillStyle = C.gold;
        const cx = e.x + e.w / 2;
        const cy = e.y + e.h / 2 + Math.sin(this.t * 2) * 1.5;
        const r = Math.min(e.w, e.h) * 0.36;
        ctx.beginPath();
        for (let i = 0; i < 6; i++) {
          const a = (i / 6) * Math.PI * 2 + this.t * 0.6;
          ctx.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r);
        }
        ctx.closePath();
        ctx.fill();
        ctx.restore();
        break;
      }
      case 'dust': {
        ctx.save();
        ctx.fillStyle = 'rgba(200,225,255,0.5)';
        for (let i = 0; i < 5; i++) {
          const p = ((this.t * 0.25 + i / 5) % 1);
          const x = e.x + ((i * 53) % e.w);
          const y = e.y + e.h - p * e.h;
          ctx.globalAlpha = Math.sin(p * Math.PI) * 0.55;
          ctx.fillRect(x, y, 1.3, 1.3);
        }
        ctx.restore();
        break;
      }
      default:
        ctx.fillStyle = '#252b58';
        roundRect(ctx, e.x, e.y, e.w, e.h, 2);
        ctx.fill();
        ctx.strokeStyle = '#454d90';
        ctx.lineWidth = 1;
        ctx.stroke();
    }
  }

  // --- Boucle principale -----------------------------------------------------

  drawWorld(world, cam, view, skin, dt, opts = {}) {
    const ctx = this.ctx;
    this.t += dt;
    const pal = palette(world.level.palette);
    this.drawBackground(view, cam, pal);
    // Marge de masquage : elle doit couvrir tout le débord, sinon la salle
    // « flotte » au milieu du fond sur un écran très allongé.
    const over = Math.max(240, (view.padX || 0) + 40, (view.padY || 0) + 40);

    ctx.save();
    ctx.translate(Math.round(-cam.x + cam.shakeX), Math.round(-cam.y + cam.shakeY));

    const L = cam.x - 40, R = cam.x + view.w + 40;
    const T = cam.y - 40, B = cam.y + view.h + 40;
    const visible = (e) => e.x + e.w > L && e.x < R && e.y + e.h > T && e.y < B;

    // Deux passes : décor et champs derrière, structures et dangers devant.
    for (const e of world.entities) {
      if (!visible(e)) continue;
      switch (e.type) {
        case 'deco': this.drawDeco(e); break;
        case 'field': this.drawField(e); break;
        case 'fan': this.drawFan(e); break;
        case 'grav': this.drawGrav(e); break;
        case 'sign': this.drawSign(e); break;
        default: break;
      }
    }
    for (const e of world.entities) {
      if (!visible(e)) continue;
      switch (e.type) {
        case 'solid': this.drawSolid(e); break;
        case 'crumble': this.drawCrumble(e); break;
        case 'vanish': this.drawVanish(e); break;
        case 'ghost': this.drawGhost(e); break;
        case 'mover': this.drawMover(e); break;
        case 'door': this.drawDoor(e); break;
        case 'crusher': this.drawCrusher(e); break;
        case 'zap': this.drawZap(e); break;
        case 'laser': this.drawLaser(e); break;
        case 'exit': this.drawExit(e); break;
        case 'button': this.drawButton(e); break;
        case 'check': this.drawCheck(e); break;
        case 'tele': this.drawTele(e); break;
        case 'clone':
          if (e.alpha > 0.02) {
            drawRobot(ctx, {
              x: e.x + e.w / 2, y: e.y + e.h / 2, skin: { ...skin, shell: 'rgba(255,120,150,0.5)', shell2: 'rgba(180,60,90,0.45)', eye: C.alert, trim: C.alert, screen: 'rgba(20,4,10,0.6)' },
              state: 'run', facing: e.facing, squash: 0, t: this.t, alpha: e.alpha,
            });
          }
          break;
        default: break;
      }
    }

    opts.particles?.draw(ctx);

    // Hors-salle : quand la pièce est plus étroite que l'écran, on masque
    // franchement l'extérieur. Sans ça, le sol « s'arrête dans le vide » et la
    // salle a l'air inachevée.
    // Étendue réellement visible du canevas, en coordonnées de salle.
    const mL = cam.x - (view.padX || 0) - over;
    const mT = cam.y - (view.padY || 0) - over;
    const mR = cam.x - (view.padX || 0) + (view.fullW || view.w) + over;
    const mB = cam.y - (view.padY || 0) + (view.fullH || view.h) + over;
    ctx.fillStyle = 'rgba(3,4,12,0.86)';
    if (mL < 0) ctx.fillRect(mL, mT, -mL, mB - mT);
    if (mR > world.w) ctx.fillRect(world.w, mT, mR - world.w, mB - mT);
    if (mT < 0) ctx.fillRect(0, mT, world.w, -mT);
    if (mB > world.h) ctx.fillRect(0, world.h, world.w, mB - world.h);

    // Le robot, toujours au premier plan.
    const p = world.player;
    if (world.state !== 'dead') {
      drawRobot(ctx, {
        x: p.cx, y: p.cy, skin,
        state: world.state === 'win' ? 'win' : p.anim,
        facing: p.facing,
        squash: p.squash * p.gravDir,
        t: this.t,
        roll: p.gravDir < 0 ? Math.PI : 0,
        groundY: p.grounded ? (p.gravDir > 0 ? p.y + p.h + 1 : null) : null,
      });
    }

    ctx.restore();
    this.drawVignette(view);
  }

  drawVignette(view) {
    const ctx = this.ctx;
    const g = ctx.createRadialGradient(
      view.w / 2, view.h / 2, view.h * 0.34,
      view.w / 2, view.h / 2, view.h * 0.92,
    );
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(1, 'rgba(0,0,0,0.42)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, view.w, view.h);
  }
}

/* ── src/core/Camera.js ──────────────────────────────────────────── */
/**
 * Caméra 2D.
 *
 * Règles tenues, dans l'ordre de priorité :
 *  1. jamais de secousse involontaire — l'amortissement est exponentiel et
 *     indépendant du framerate ;
 *  2. anticipation douce dans le sens de la course (on voit venir le danger) ;
 *  3. une salle qui tient à l'écran est CENTRÉE, elle ne défile pas ;
 *  4. le tremblement d'impact est bref, borné, et jamais pendant un saut
 *     précis.
 */
class Camera {
  constructor() {
    this.x = 0;
    this.y = 0;
    this.shakeX = 0;
    this.shakeY = 0;
    this.shake = 0;
    this.lookX = 0;
    this.seed = 1;
  }

  /** Recadre instantanément (début de niveau, téléportation). */
  snap(world, view) {
    const t = this.target(world, view);
    this.x = t.x;
    this.y = t.y;
    this.lookX = 0;
    this.shake = 0;
  }

  target(world, view) {
    const p = world.player;
    const maxX = Math.max(0, world.w - view.w);
    const maxY = Math.max(0, world.h - view.h);
    let x = p.cx - view.w / 2 + this.lookX;
    let y = p.cy - view.h * 0.55;
    if (world.w <= view.w) x = (world.w - view.w) / 2;
    else x = clamp(x, 0, maxX);
    if (world.h <= view.h) y = (world.h - view.h) / 2;
    else y = clamp(y, 0, maxY);
    return { x, y };
  }

  addShake(power) {
    this.shake = Math.min(1, this.shake + power);
  }

  update(world, view, dt) {
    const p = world.player;
    // Anticipation : la caméra regarde légèrement devant, proportionnellement
    // à la vitesse réelle. Pas d'à-coup quand on change de sens.
    const want = clamp(p.vx / 190, -1, 1) * 46;
    this.lookX = damp(this.lookX, want, 3.2, dt);

    const t = this.target(world, view);
    // Suivi plus vif verticalement : en gravité inversée, tarder à recadrer
    // rend le niveau illisible.
    this.x = damp(this.x, t.x, 9, dt);
    this.y = damp(this.y, t.y, 11, dt);

    if (this.shake > 0.001) {
      this.shake = Math.max(0, this.shake - dt * 3.4);
      const s = this.shake * this.shake * 7;
      this.seed = (this.seed * 1103515245 + 12345) & 0x7fffffff;
      const a = (this.seed / 0x7fffffff) * Math.PI * 2;
      this.shakeX = Math.cos(a) * s;
      this.shakeY = Math.sin(a) * s;
    } else {
      this.shakeX = 0;
      this.shakeY = 0;
    }
  }
}

/* ── src/core/Particles.js ───────────────────────────────────────── */
/**
 * Système de particules à pool fixe.
 *
 * Aucune allocation pendant le jeu : 400 particules sont créées une fois pour
 * toutes et recyclées. Sur mobile, le ramasse-miettes est la première cause de
 * micro-saccades — et une saccade dans un jeu au pixel près, c'est une mort
 * imméritée.
 */
const MAX = 400;

class Particles {
  constructor() {
    this.p = new Array(MAX);
    for (let i = 0; i < MAX; i++) {
      this.p[i] = { on: false, x: 0, y: 0, vx: 0, vy: 0, life: 0, max: 1, size: 2, col: '#fff', grav: 0, fade: 1 };
    }
    this.head = 0;
    this.seed = 987;
  }

  rnd() {
    this.seed = (this.seed * 1664525 + 1013904223) & 0x7fffffff;
    return this.seed / 0x7fffffff;
  }

  spawn(x, y, opts) {
    const q = this.p[this.head];
    this.head = (this.head + 1) % MAX;
    q.on = true;
    q.x = x; q.y = y;
    q.vx = opts.vx ?? 0;
    q.vy = opts.vy ?? 0;
    q.life = q.max = opts.life ?? 0.5;
    q.size = opts.size ?? 2;
    q.col = opts.col ?? C.cyan;
    q.grav = opts.grav ?? 0;
    q.fade = opts.fade ?? 1;
  }

  burst(x, y, n, opts = {}) {
    for (let i = 0; i < n; i++) {
      const a = this.rnd() * Math.PI * 2;
      const s = (opts.speed ?? 90) * (0.35 + this.rnd() * 0.65);
      this.spawn(x, y, {
        vx: Math.cos(a) * s,
        vy: Math.sin(a) * s - (opts.lift ?? 0),
        life: (opts.life ?? 0.5) * (0.6 + this.rnd() * 0.8),
        size: opts.size ?? 2.4,
        col: opts.col ?? C.cyan,
        grav: opts.grav ?? 420,
      });
    }
  }

  /** Réaction visuelle aux évènements du monde. Un effet, un sens. */
  handle(ev) {
    switch (ev.type) {
      case 'death':
        this.burst(ev.x, ev.y, 26, { speed: 200, col: C.white, size: 2.8, life: 0.55 });
        this.burst(ev.x, ev.y, 16, {
          speed: 150, life: 0.7, size: 3.2,
          col: ev.kind === 'burn' ? C.danger : ev.kind === 'zap' ? C.gold : C.violet,
        });
        break;
      case 'win':
        this.burst(ev.x, ev.y, 30, { speed: 130, col: C.cyan, size: 2.6, life: 0.9, grav: 120 });
        break;
      case 'land':
        if (ev.power > 0.18) {
          for (let i = 0; i < 5; i++) {
            this.spawn(ev.x + (this.rnd() - 0.5) * 14, ev.y, {
              vx: (this.rnd() - 0.5) * 90, vy: -20 - this.rnd() * 30,
              life: 0.28, size: 1.8, col: 'rgba(180,200,255,0.9)', grav: 300,
            });
          }
        }
        break;
      case 'jump':
        for (let i = 0; i < 3; i++) {
          this.spawn(ev.x + (this.rnd() - 0.5) * 10, ev.y, {
            vx: (this.rnd() - 0.5) * 50, vy: 20, life: 0.22, size: 1.6,
            col: 'rgba(160,190,255,0.8)', grav: 120,
          });
        }
        break;
      case 'dash':
        for (let i = 0; i < 8; i++) {
          this.spawn(ev.x, ev.y + (this.rnd() - 0.5) * 14, {
            vx: -ev.dir * (80 + this.rnd() * 140), vy: (this.rnd() - 0.5) * 40,
            life: 0.3, size: 2.2, col: C.cyan, grav: 0,
          });
        }
        break;
      case 'crumble':
        for (let i = 0; i < 10; i++) {
          this.spawn(ev.x + (this.rnd() - 0.5) * (ev.w || 24), ev.y, {
            vx: (this.rnd() - 0.5) * 60, vy: 10, life: 0.8, size: 2.6,
            col: '#3a3f7a', grav: 620,
          });
        }
        break;
      case 'vanish':
        this.burst(ev.x, ev.y, 8, { speed: 60, col: C.cyan, size: 2, life: 0.4, grav: 0 });
        break;
      case 'warp':
      case 'fakeExit':
        this.burst(ev.x, ev.y, 18, { speed: 160, col: C.violet, size: 2.6, life: 0.5, grav: 0 });
        break;
      case 'gravity':
        this.burst(ev.x, ev.y, 14, { speed: 110, col: '#a378ff', size: 2.4, life: 0.5, grav: 0 });
        break;
      case 'checkpoint':
        this.burst(ev.x, ev.y, 14, { speed: 90, col: C.cyan, size: 2.2, life: 0.6, grav: -60 });
        break;
      case 'slam':
        this.burst(ev.x, ev.y, 12, { speed: 130, col: '#6a5a90', size: 2.4, life: 0.4, grav: 500 });
        break;
      default: break;
    }
  }

  update(dt) {
    for (const q of this.p) {
      if (!q.on) continue;
      q.life -= dt;
      if (q.life <= 0) { q.on = false; continue; }
      q.vy += q.grav * dt;
      q.x += q.vx * dt;
      q.y += q.vy * dt;
    }
  }

  draw(ctx) {
    for (const q of this.p) {
      if (!q.on) continue;
      const a = Math.max(0, q.life / q.max) ** q.fade;
      ctx.globalAlpha = a;
      ctx.fillStyle = q.col;
      const s = q.size * (0.5 + a * 0.5);
      ctx.fillRect(q.x - s / 2, q.y - s / 2, s, s);
    }
    ctx.globalAlpha = 1;
  }

  clear() {
    for (const q of this.p) q.on = false;
  }
}

/* ── src/core/Game.js ────────────────────────────────────────────── */
/**
 * GameManager — la boucle et le cycle de vie d'une tentative.
 *
 * Le point le plus important de tout le projet tient en une ligne : entre la
 * mort et la reprise, il s'écoule 320 ms. Pas d'écran de game over, pas de
 * bouton « réessayer », pas de transition. C'est la seule chose qui rende un
 * jeu de mille morts supportable — et le joueur peut même écourter ce délai en
 * appuyant sur saut.
 *
 * La boucle est à pas fixe avec accumulateur : la simulation avance toujours
 * par pas de 1/60 s, quel que soit le taux de rafraîchissement de l'écran
 * (60, 90 ou 120 Hz). Sans cela, un même saut n'aurait pas la même hauteur sur
 * deux téléphones — faute rédhibitoire dans un jeu au pixel près.
 */
class Game {
  constructor(canvas, deps) {
    this.canvas = canvas;
    this.save = deps.save;
    this.audio = deps.audio;
    this.haptics = deps.haptics;
    this.input = deps.input;
    this.achievements = deps.achievements;
    this.ui = null; // branché par UIManager

    this.renderer = new Renderer(canvas);
    this.camera = new Camera();
    this.particles = new Particles();
    this.view = { w: 640, h: VIEW_H, scale: 1 };

    this.mode = 'menu'; // menu | play | paused | win
    this.world = null;
    this.levelNum = 1;
    this.attempt = 1;
    this.deathsThisLevel = 0;
    this.deathHold = 0;
    this.levelMemory = new Map();
    this.checkpoint = null;
    this.prevTrace = null;
    this.rng = makeRng(Date.now() & 0xffff);

    this.acc = 0;
    this.last = 0;
    this.raf = null;
    this.fpsSamples = [];

    addEventListener('resize', () => this.resize());
    addEventListener('orientationchange', () => setTimeout(() => this.resize(), 120));
    this.resize();
  }

  get skin() {
    return SKIN_BY_ID[this.save.data.skin] || SKIN_BY_ID.standard;
  }

  /**
   * Mise à l'échelle.
   *
   * La hauteur virtuelle est FIXE (360 px) et la largeur s'adapte au ratio :
   * un téléphone très allongé voit plus large, jamais plus haut. C'est la
   * seule façon d'avoir un level design identique sur tous les appareils —
   * personne ne doit pouvoir « voir le piège » parce qu'il a un meilleur
   * téléphone.
   */
  resize() {
    const dpr = Math.min(devicePixelRatio || 1, 2.5);
    const cw = this.canvas.clientWidth || innerWidth;
    const ch = this.canvas.clientHeight || innerHeight;
    const ratio = cw / ch;
    const vw = Math.round(Math.max(VIEW_W_MIN, Math.min(VIEW_W_MAX, VIEW_H * ratio)));
    this.view.w = vw;
    this.view.h = VIEW_H;
    this.canvas.width = Math.round(cw * dpr);
    this.canvas.height = Math.round(ch * dpr);
    const scale = Math.min(this.canvas.width / vw, this.canvas.height / VIEW_H);
    this.view.scale = scale;
    const offX = Math.round((this.canvas.width - vw * scale) / 2);
    const offY = Math.round((this.canvas.height - VIEW_H * scale) / 2);
    // Débord : la zone de canevas située HORS de la boîte de jeu, exprimée en
    // unités de jeu. Le fond y est peint aussi — sans quoi un écran au ratio
    // inhabituel (portrait, panneau étroit) encadre la salle de deux bandes
    // noires franches, ce qui a l'air d'un bug plutôt que d'un cadrage.
    this.view.padX = offX / scale;
    this.view.padY = offY / scale;
    this.view.fullW = this.canvas.width / scale;
    this.view.fullH = this.canvas.height / scale;
    const ctx = this.renderer.ctx;
    ctx.setTransform(scale, 0, 0, scale, offX, offY);
    ctx.imageSmoothingEnabled = false;
  }

  // --- Cycle de vie d'un niveau ---------------------------------------------

  startLevel(num) {
    this.levelNum = Math.max(1, Math.min(LEVEL_COUNT, num));
    this.attempt = 1;
    this.deathsThisLevel = 0;
    this.levelMemory = new Map();
    this.checkpoint = null;
    this.prevTrace = null;
    this.mode = 'play';
    this.spawnWorld();
    this.camera.snap(this.world, this.view);
    this.audio.startMusic(this.world.level.chapterId);
    this.audio.duck(false);
    this.ui?.onLevelStart(this.world.level, this.attempt);
    this.start();
  }

  spawnWorld() {
    const level = getLevel(this.levelNum);
    this.world = new World(level, {
      dash: level.dash === true,
      memory: this.levelMemory,
      startAt: this.checkpoint,
      ghostTrace: this.prevTrace,
    });
    this.particles.clear();
    this.input.releaseAll();
    this.secretTaken = false;
  }

  restart() {
    this.attempt++;
    this.prevTrace = this.world?.trace || null;
    this.spawnWorld();
    this.camera.snap(this.world, this.view);
    this.ui?.onAttempt(this.attempt);
  }

  retry() {
    // Recommencer volontairement remet aussi le point de contrôle à zéro.
    this.checkpoint = null;
    this.restart();
  }

  nextLevel() {
    if (this.levelNum >= LEVEL_COUNT) { this.quitToMenu(); this.ui?.showScreen('menu'); return; }
    this.startLevel(this.levelNum + 1);
  }

  pause() {
    if (this.mode !== 'play') return;
    this.mode = 'paused';
    this.input.releaseAll();
    this.audio.duck(true);
    this.ui?.showScreen('pause');
    const rec = this.save.level(this.levelNum);
    this.ui?.setPauseInfo(
      `SALLE ${String(this.levelNum).padStart(2, '0')} — ${this.world.level.name.toUpperCase()}`
      + ` · ESSAI ${this.attempt} · ${rec.deaths} MORTS ICI`,
    );
  }

  resume() {
    if (this.mode !== 'paused') return;
    this.mode = 'play';
    this.audio.duck(false);
    this.last = performance.now();
    this.ui?.showScreen(null);
  }

  quitToMenu() {
    this.mode = 'menu';
    this.stop();
    this.audio.stopMusic();
    this.save.flush();
  }

  // --- Boucle ---------------------------------------------------------------

  start() {
    if (this.raf) return;
    this.last = performance.now();
    this.acc = 0;
    const tick = (ts) => {
      this.raf = requestAnimationFrame(tick);
      this.frame(ts);
    };
    this.raf = requestAnimationFrame(tick);
  }

  stop() {
    if (this.raf) cancelAnimationFrame(this.raf);
    this.raf = null;
  }

  frame(ts) {
    let dt = (ts - this.last) / 1000;
    this.last = ts;
    if (dt > MAX_FRAME_DT) dt = MAX_FRAME_DT; // retour d'arrière-plan : on n'accumule pas
    this.trackFps(dt);

    if (this.mode === 'play') {
      this.input.pollPad();
      this.acc += dt;
      let steps = 0;
      // Le premier pas de la frame reçoit les fronts montants ; les suivants
      // héritent d'un appui « maintenu ». Un tap de 15 ms est donc entendu
      // une fois, et une seule.
      while (this.acc >= FIXED_DT && steps < 6) {
        const inp = steps === 0
          ? this.input.consume()
          : { ...this.lastInput, jumpPressed: false, dashPressed: false };
        this.lastInput = inp;
        this.world.step(inp);
        this.acc -= FIXED_DT;
        steps++;
        this.drainWorld();
        if (this.world.state !== 'run') break;
      }
      if (steps >= 6) this.acc = 0;

      if (this.world.state === 'dead') this.tickDeath(dt);
      this.save.data.playTime += dt;
    }

    if (this.world) {
      this.camera.update(this.world, this.view, dt);
      this.particles.update(dt);
      this.renderer.drawWorld(this.world, this.camera, this.view, this.skin, dt, {
        particles: this.particles,
      });
      this.ui?.onFrame(this.world, this.mode);
    }
  }

  /** Qualité adaptative : si l'appareil peine, on allège le fond avant tout. */
  trackFps(dt) {
    this.fpsSamples.push(dt);
    if (this.fpsSamples.length < 90) return;
    const avg = this.fpsSamples.reduce((a, b) => a + b, 0) / this.fpsSamples.length;
    this.fpsSamples.length = 0;
    if (avg > 0.0235 && this.renderer.quality > 0) this.renderer.quality = 0;
    else if (avg < 0.0180 && this.renderer.quality < 1) this.renderer.quality = 1;
  }

  /** Traduit les évènements de simulation en son, vibration, particules. */
  drainWorld() {
    for (const ev of this.world.drainEvents()) {
      this.particles.handle(ev);
      switch (ev.type) {
        case 'death':
          this.audio.play('death');
          this.haptics.fire('death');
          this.camera.addShake(0.9);
          this.ui?.flash();
          this.onDeath(ev);
          break;
        case 'win':
          this.audio.play('win');
          this.haptics.fire('win');
          this.onWin();
          break;
        case 'jump': this.audio.play('jump'); break;
        case 'land':
          if (ev.power > 0.5) { this.audio.play('land'); this.camera.addShake(ev.power * 0.18); }
          break;
        case 'dash': this.audio.play('dash'); this.haptics.fire('impact'); break;
        case 'click': this.audio.play('click'); this.haptics.fire('mech'); break;
        case 'unclick': this.audio.play('unclick'); break;
        case 'mech': this.audio.play('mech'); break;
        case 'creak': this.audio.play('creak'); break;
        case 'crumble': this.audio.play('crumble'); this.camera.addShake(0.2); break;
        case 'slam': this.audio.play('slam'); this.haptics.fire('impact'); this.camera.addShake(0.5); break;
        case 'alarm': this.audio.play('alarm'); break;
        case 'laser': this.audio.play('laser'); break;
        case 'warp': case 'fakeExit': this.audio.play('warp'); break;
        case 'gravity': this.audio.play('gravity'); this.haptics.fire('mech'); this.camera.addShake(0.3); break;
        case 'checkpoint': this.audio.play('checkpoint'); this.haptics.fire('mech'); break;
        case 'checkpointFake': this.audio.play('checkpoint'); break;
        default: break;
      }
    }
    // Signal de salle secrète : émis par une zone, récompensé ici.
    if (this.world.isOn('secret') && !this.secretTaken) {
      this.secretTaken = true;
      if (this.save.markSecret(this.levelNum)) {
        this.audio.play('secret');
        this.ui?.toast('SALLE SECRÈTE', 'Quelqu\'un a caché ça ici exprès.');
        this.checkUnlocks();
      }
    }
    // Le point de contrôle survit à la mort : c'est tout son intérêt.
    if (this.world.checkpoint) this.checkpoint = this.world.checkpoint;
  }

  onDeath(ev) {
    this.deathsThisLevel++;
    this.save.addDeath(this.levelNum);
    this.deathHold = 0.32;

    const exit = this.world.findAll('exit').find((e) => !e.fake);
    const near = exit
      ? Math.hypot(ev.x - (exit.x + exit.w / 2), ev.y - (exit.y + exit.h / 2)) < 90
      : false;
    const quip = pickQuip({
      attempt: this.attempt,
      totalDeaths: this.save.data.totalDeaths,
      nearExit: near,
      rng: this.rng,
    });
    this.ui?.onDeath(this.attempt + 1, quip);
    this.checkUnlocks();
  }

  tickDeath(dt) {
    this.deathHold -= dt;
    // Appuyer sur saut pendant l'explosion relance immédiatement. Le joueur
    // impatient a toujours raison.
    if (this.deathHold <= 0 || this.input.jumpQueued) {
      this.input.jumpQueued = false;
      this.restart();
    }
  }

  onWin() {
    const time = this.world.time;
    const firstClear = this.save.complete(this.levelNum, time, this.deathsThisLevel);
    this.mode = 'win';
    this.audio.duck(true);
    const line = WIN_LINES[Math.floor(this.rng() * WIN_LINES.length)];
    const rec = this.save.level(this.levelNum);
    this.ui?.showWin({
      level: this.world.level,
      time,
      best: rec.best,
      deaths: this.deathsThisLevel,
      firstClear,
      line,
      isLast: this.levelNum >= LEVEL_COUNT,
    });
    this.checkUnlocks();
    this.save.flush();
  }

  checkUnlocks() {
    const news = this.achievements.check(LEVEL_COUNT);
    for (const n of news) {
      this.audio.play('unlock');
      this.ui?.toast(
        n.kind === 'skin' ? `ROBOT DÉBLOQUÉ — ${n.name}` : `ACCOMPLISSEMENT — ${n.name}`,
        n.desc,
      );
    }
  }
}

/* ── src/ui/UIManager.js ─────────────────────────────────────────── */
/**
 * UIManager — tous les écrans hors jeu, en DOM.
 *
 * Pourquoi le DOM plutôt que du dessin sur le canvas : accessibilité (lecteurs
 * d'écran, tailles de police système), défilement natif fluide au doigt, zones
 * de frappe correctes sans les recoder, et surtout zéro coût pendant le jeu —
 * un écran masqué ne consomme rien, alors qu'une UI dessinée coûte à chaque
 * frame, y compris quand elle est invisible.
 */
class UIManager {
  constructor(game) {
    this.game = game;
    game.ui = this;
    this.el = {};
    const id = (s) => document.getElementById(s);
    this.el.hud = id('hud');
    this.el.touch = id('touch');
    this.el.num = id('hud-num');
    this.el.name = id('hud-name');
    this.el.attempt = id('hud-attempt');
    this.el.time = id('hud-time');
    this.el.band = id('deathband');
    this.el.bandText = id('deathband-text');
    this.el.flash = id('flash');
    this.el.toasts = id('toast-wrap');
    this.el.dash = document.querySelector('.pad-dash');
    this.screens = {};
    for (const s of document.querySelectorAll('.screen')) {
      this.screens[s.dataset.screen] = s;
    }
    this.current = 'menu';
    this.bandTimer = null;
    this.menuT = 0;

    this.bindNav();
    this.applySettings();
    this.showScreen('menu');
    this.animateMenuRobot();
  }

  // --- Navigation ------------------------------------------------------------

  bindNav() {
    document.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-go]');
      if (!btn) return;
      this.game.audio.unlock();
      this.game.audio.play('ui');
      this.go(btn.dataset.go);
    });
    document.getElementById('btn-pause').addEventListener('click', () => this.game.pause());
    addEventListener('keydown', (e) => {
      if (e.code === 'Escape') {
        if (this.game.mode === 'play') this.game.pause();
        else if (this.game.mode === 'paused') this.game.resume();
      }
    });
    // Perdre le focus (appel, notification) met en pause : on ne meurt pas
    // parce que le téléphone a sonné.
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && this.game.mode === 'play') this.game.pause();
    });
  }

  go(where) {
    const g = this.game;
    switch (where) {
      case 'play': g.startLevel(g.save.maxUnlockedLevel(LEVEL_COUNT)); this.showScreen(null); break;
      // L'écran est affiché AVANT d'être rempli : les aperçus animés se
      // coupent d'eux-mêmes tant que leur écran n'est pas l'écran courant, et
      // resteraient donc vides si on inversait ces deux lignes.
      case 'levels': this.showScreen('levels'); this.buildLevels(); break;
      case 'robot': this.showScreen('robot'); this.buildSkins(); break;
      case 'stats': this.showScreen('stats'); this.buildStats(); break;
      case 'settings': this.showScreen('settings'); this.buildSettings(); break;
      case 'menu': g.quitToMenu(); this.refreshMenu(); this.showScreen('menu'); break;
      case 'resume': g.resume(); break;
      case 'retry': g.mode = 'play'; g.audio.duck(false); g.retry(); this.showScreen(null); g.start(); break;
      case 'next': g.nextLevel(); this.showScreen(null); break;
      default: break;
    }
  }

  showScreen(name) {
    for (const [k, el] of Object.entries(this.screens)) el.hidden = k !== name;
    this.current = name;
    const playing = name === null;
    this.el.hud.hidden = !playing;
    this.el.touch.hidden = !playing;
    if (name === 'menu') this.refreshMenu();
  }

  // --- Pendant le jeu --------------------------------------------------------

  onLevelStart(level, attempt) {
    this.el.num.textContent = String(level.num).padStart(2, '0');
    this.el.name.textContent = level.name.toUpperCase();
    this.el.attempt.textContent = attempt;
    this.el.dash.hidden = !level.dash;
    if (level.hint) this.band(level.hint, 1800);
  }

  onAttempt(n) {
    this.el.attempt.textContent = n;
  }

  setPauseInfo(text) {
    document.getElementById('pause-sub').textContent = text;
  }

  onFrame(world, mode) {
    if (mode === 'play' || mode === 'paused') {
      this.el.time.textContent = world.time.toFixed(2);
    }
  }

  onDeath(nextAttempt, quip) {
    // Le compteur d'essai est TOUJOURS affiché, la vanne seulement parfois.
    this.band(quip ? `${quip} · ESSAI ${nextAttempt}` : `ESSAI ${nextAttempt}`, 900);
  }

  band(text, ms) {
    this.el.bandText.textContent = text;
    this.el.band.hidden = false;
    this.el.band.style.animation = 'none';
    void this.el.band.offsetWidth;
    this.el.band.style.animation = '';
    clearTimeout(this.bandTimer);
    this.bandTimer = setTimeout(() => { this.el.band.hidden = true; }, ms);
  }

  flash() {
    this.el.flash.classList.remove('on');
    void this.el.flash.offsetWidth;
    this.el.flash.classList.add('on');
  }

  toast(title, desc) {
    const d = document.createElement('div');
    d.className = 'toast';
    d.innerHTML = `<b></b><small></small>`;
    d.querySelector('b').textContent = title;
    d.querySelector('small').textContent = desc || '';
    this.el.toasts.appendChild(d);
    setTimeout(() => {
      d.style.transition = 'opacity .35s, transform .35s';
      d.style.opacity = '0';
      d.style.transform = 'translateX(12px)';
      setTimeout(() => d.remove(), 400);
    }, 3200);
  }

  showWin(info) {
    document.getElementById('win-title').textContent =
      `SALLE ${String(info.level.num).padStart(2, '0')} — ${info.level.name.toUpperCase()}`;
    document.getElementById('win-line').textContent =
      info.isLast ? 'Tu es sorti. La station, elle, est toujours là.' : info.line;
    document.getElementById('win-time').textContent = formatTime(info.time);
    document.getElementById('win-deaths').textContent = info.deaths;
    document.getElementById('win-best').textContent = formatTime(info.best);
    const next = document.querySelector('[data-go="next"]');
    next.textContent = info.isLast ? 'FIN' : 'SALLE SUIVANTE';
    this.showScreen('win');
  }

  // --- Menu ------------------------------------------------------------------

  refreshMenu() {
    const n = this.game.save.maxUnlockedLevel(LEVEL_COUNT);
    const done = this.game.save.stats(LEVEL_COUNT).completedCount;
    document.getElementById('menu-play-label').textContent = done ? 'CONTINUER' : 'JOUER';
    document.getElementById('menu-play-sub').textContent =
      done >= LEVEL_COUNT ? 'Toutes les salles franchies' : `Salle ${String(n).padStart(2, '0')}`;
  }

  animateMenuRobot() {
    const cv = document.getElementById('menu-robot');
    const ctx = cv.getContext('2d');
    const loop = () => {
      requestAnimationFrame(loop);
      if (this.current !== 'menu') return;
      this.menuT += 1 / 60;
      ctx.clearRect(0, 0, cv.width, cv.height);
      ctx.save();
      ctx.translate(cv.width / 2, cv.height / 2 + Math.sin(this.menuT * 1.6) * 6);
      drawRobotPortrait(ctx, 0, 0, this.game.skin, 3.4, this.menuT, 'idle');
      ctx.restore();
    };
    loop();
  }

  // --- Sélection de niveaux --------------------------------------------------

  buildLevels() {
    const save = this.game.save;
    const maxUnlocked = save.maxUnlockedLevel(LEVEL_COUNT);
    const host = document.getElementById('levels-list');
    host.innerHTML = '';
    const st = save.stats(LEVEL_COUNT);
    document.getElementById('levels-meta').textContent =
      `${st.completedCount}/${LEVEL_COUNT} · ${formatInt(st.totalDeaths)} morts`;

    for (const { chapter, from, to } of chapterRanges()) {
      const head = document.createElement('div');
      head.className = 'chapter-title';
      head.innerHTML = '<h3></h3><span></span>';
      head.querySelector('h3').textContent = `CHAPITRE ${chapter.id} — ${chapter.name.toUpperCase()}`;
      head.querySelector('span').textContent = chapter.subtitle;
      host.appendChild(head);

      const grid = document.createElement('div');
      grid.className = 'lv-grid';
      for (let n = from; n <= to; n++) {
        const rec = save.data.levels[String(n)] || {};
        const locked = n > maxUnlocked;
        const b = document.createElement('button');
        b.className = `lv${rec.done ? ' done' : ''}${locked ? ' locked' : ''}`;
        b.disabled = locked;
        const lvl = CHAPTERS[chapter.id - 1].levels[n - from];
        b.innerHTML = `
          <div class="lv-num">${String(n).padStart(2, '0')}<i>${rec.done ? '✓' : ''}</i></div>
          <div class="lv-name"></div>
          <div class="lv-stat"><span>☠ <b>${rec.deaths || 0}</b></span><span>${rec.best ? formatTime(rec.best) : '—'}</span>${rec.secret ? '<span class="lv-secret">★</span>' : ''}</div>`;
        b.querySelector('.lv-name').textContent = locked ? '— verrouillé —' : lvl.name;
        b.addEventListener('click', () => {
          this.game.audio.unlock();
          this.game.startLevel(n);
          this.showScreen(null);
        });
        grid.appendChild(b);
      }
      host.appendChild(grid);
    }
  }

  // --- Robots ----------------------------------------------------------------

  buildSkins() {
    const save = this.game.save;
    const stats = save.stats(LEVEL_COUNT);
    const host = document.getElementById('skins-list');
    host.innerHTML = '';
    const unlockedCount = SKINS.filter((s) => isSkinUnlocked(s, stats)).length;
    document.getElementById('robot-meta').textContent = `${unlockedCount}/${SKINS.length} débloqués`;

    const preview = document.getElementById('robot-preview');
    const pctx = preview.getContext('2d');
    const showInfo = (skin, unlocked) => {
      document.getElementById('robot-name').textContent = skin.name;
      document.getElementById('robot-desc').textContent = skin.desc;
      document.getElementById('robot-lock').textContent =
        unlocked ? '' : `Verrouillé — ${skin.unlock.label}`;
      let t = 0;
      const draw = () => {
        if (this.current !== 'robot' || this.previewId !== skin.id) return;
        requestAnimationFrame(draw);
        t += 1 / 60;
        pctx.clearRect(0, 0, preview.width, preview.height);
        pctx.save();
        pctx.translate(preview.width / 2, preview.height / 2 + Math.sin(t * 1.8) * 5);
        drawRobotPortrait(pctx, 0, 0, skin, 3.6, t, 'idle');
        pctx.restore();
      };
      this.previewId = skin.id;
      draw();
    };

    for (const skin of SKINS) {
      const unlocked = save.data.unlocked.includes(skin.id) || isSkinUnlocked(skin, stats);
      const cell = document.createElement('button');
      cell.className = `skin${save.data.skin === skin.id ? ' sel' : ''}${unlocked ? '' : ' locked'}`;
      cell.innerHTML = '<canvas width="120" height="80"></canvas><span></span>';
      cell.querySelector('span').textContent = unlocked ? skin.name : '???';
      const c = cell.querySelector('canvas');
      const cx = c.getContext('2d');
      cx.save();
      cx.translate(60, 42);
      // t = 1,2 s et non 0 : à t = 0 le robot est en plein clignement et
      // toutes les vignettes auraient les yeux fermés.
      drawRobotPortrait(cx, 0, 0, skin, 2.4, 1.2, unlocked ? 'idle' : 'dead');
      cx.restore();
      cell.addEventListener('click', () => {
        showInfo(skin, unlocked);
        if (!unlocked) { this.game.audio.play('unclick'); return; }
        save.data.skin = skin.id;
        save.save();
        this.game.audio.play('click');
        for (const el of host.querySelectorAll('.skin')) el.classList.remove('sel');
        cell.classList.add('sel');
      });
      host.appendChild(cell);
    }
    const cur = SKIN_BY_ID[save.data.skin] || SKINS[0];
    showInfo(cur, true);
  }

  // --- Statistiques ----------------------------------------------------------

  buildStats() {
    const save = this.game.save;
    const s = save.stats(LEVEL_COUNT);
    const host = document.getElementById('stats-body');
    const worst = s.worstLevel && s.worstLevel[1].deaths > 0
      ? `Salle ${String(s.worstLevel[0]).padStart(2, '0')} — ${s.worstLevel[1].deaths} morts`
      : 'Aucune salle ne t\'a encore vaincu';
    const hours = Math.floor(s.playTime / 3600);
    const mins = Math.floor((s.playTime % 3600) / 60);

    // Le compteur de morts est mis en avant, pas caché : dans ce jeu, mourir
    // est la mécanique principale. Autant en faire un trophée.
    host.innerHTML = `
      <div class="stat-grid">
        <div class="stat"><b>${formatInt(s.totalDeaths)}</b><small>MORTS TOTALES</small></div>
        <div class="stat"><b>${formatInt(s.deathsToday)}</b><small>MORTS AUJOURD'HUI</small></div>
        <div class="stat"><b>${s.completedCount}/${LEVEL_COUNT}</b><small>SALLES FRANCHIES</small></div>
        <div class="stat"><b>${s.secrets}/3</b><small>SALLES SECRÈTES</small></div>
        <div class="stat"><b>${s.bestTimeAny ? formatTime(s.bestTimeAny) : '—'}</b><small>MEILLEUR TEMPS</small></div>
        <div class="stat"><b>${s.bestCleanStreak}</b><small>SÉRIE SANS MOURIR</small></div>
        <div class="stat wide"><b>${worst}</b><small>TA NÉMÉSIS</small></div>
        <div class="stat wide"><b>${hours} h ${String(mins).padStart(2, '0')}</b><small>TEMPS DE JEU</small></div>
      </div>
      <div class="chapter-title"><h3>ACCOMPLISSEMENTS</h3></div>
      <div id="ach-list"></div>`;

    const list = host.querySelector('#ach-list');
    for (const a of this.game.achievements.earned()) {
      const row = document.createElement('div');
      row.className = `ach ${a.done ? 'done' : 'todo'}`;
      row.innerHTML = `<i>${a.done ? '★' : '☆'}</i><div><b></b><small></small></div>`;
      row.querySelector('b').textContent = a.name;
      row.querySelector('small').textContent = a.desc;
      list.appendChild(row);
    }
  }

  // --- Paramètres ------------------------------------------------------------

  buildSettings() {
    const st = this.game.save.data.settings;
    const host = document.getElementById('settings-body');
    host.innerHTML = `
      <div class="row"><label>MUSIQUE</label><input type="range" id="set-music" min="0" max="1" step="0.05"></div>
      <div class="row"><label>EFFETS SONORES</label><input type="range" id="set-sfx" min="0" max="1" step="0.05"></div>
      <div class="row"><label>VIBRATIONS<small>Mort, impact, réussite, mécanisme</small></label>
        <div class="seg" id="set-hap"><button data-v="1">OUI</button><button data-v="0">NON</button></div></div>
      <div class="row"><label>MAIN DIRECTRICE<small>Inverse la position des commandes</small></label>
        <div class="seg" id="set-hand"><button data-v="right">DROITE</button><button data-v="left">GAUCHE</button></div></div>
      <div class="row"><label>EFFACER LA PROGRESSION<small>Irréversible : niveaux, morts, robots, records</small></label>
        <button class="btn danger-btn" id="set-reset">EFFACER</button></div>
      <div class="row"><label style="opacity:.5">VOID RUNNER — prototype jouable<small>30 salles · moteur déterministe · aucune publicité intrusive</small></label></div>`;

    const music = host.querySelector('#set-music');
    const sfx = host.querySelector('#set-sfx');
    music.value = st.music;
    sfx.value = st.sfx;
    const apply = () => {
      st.music = Number(music.value);
      st.sfx = Number(sfx.value);
      this.game.save.save();
      this.applySettings();
    };
    music.addEventListener('input', apply);
    sfx.addEventListener('input', () => { apply(); this.game.audio.play('ui'); });

    const seg = (host2, value, onPick) => {
      for (const b of host2.querySelectorAll('button')) {
        b.classList.toggle('on', String(value) === b.dataset.v);
        b.addEventListener('click', () => {
          onPick(b.dataset.v);
          for (const o of host2.querySelectorAll('button')) o.classList.toggle('on', o === b);
        });
      }
    };
    seg(host.querySelector('#set-hap'), st.haptics ? 1 : 0, (v) => {
      st.haptics = v === '1';
      this.game.save.save();
      this.applySettings();
      if (st.haptics) this.game.haptics.fire('impact');
    });
    seg(host.querySelector('#set-hand'), st.hand, (v) => {
      st.hand = v;
      this.game.save.save();
      this.applySettings();
    });

    let armed = false;
    const reset = host.querySelector('#set-reset');
    reset.addEventListener('click', () => {
      // Double confirmation sur place : pas de boîte de dialogue système, mais
      // pas d'effacement accidentel non plus.
      if (!armed) {
        armed = true;
        reset.textContent = 'CONFIRMER ?';
        setTimeout(() => { armed = false; reset.textContent = 'EFFACER'; }, 3500);
        return;
      }
      this.game.save.reset();
      this.applySettings();
      this.buildSettings();
      this.toast('PROGRESSION EFFACÉE', 'On repart de la salle 01.');
    });
  }

  applySettings() {
    const st = this.game.save.data.settings;
    this.game.audio.setVolumes({ music: st.music, sfx: st.sfx });
    this.game.haptics.enabled = st.haptics !== false;
    document.body.classList.toggle('hand-left', st.hand === 'left');
  }
}

/* ── src/core/Save.js ────────────────────────────────────────────── */
/**
 * Sauvegarde locale.
 *
 * Format versionné et migrable dès le départ : ajouter un chapitre ou une
 * statistique ne doit jamais effacer la progression d'un joueur. Toute la
 * lecture passe par des valeurs par défaut, ce qui rend une sauvegarde
 * partiellement corrompue inoffensive.
 *
 * L'API est volontairement synchrone et plate — `load()` / `save()` — pour
 * qu'un backend distant (iCloud, Google Play Jeux) puisse être branché plus
 * tard en remplaçant uniquement `read()` et `write()`.
 */

const KEY = 'voidrunner.save.v1';

const DEFAULTS = {
  version: 1,
  levels: {}, // num -> { done, deaths, best, secret }
  totalDeaths: 0,
  deathsByDay: {}, // 'AAAA-MM-JJ' -> nombre
  skin: 'standard',
  unlocked: ['standard'],
  achievements: [],
  cleanStreak: 0,
  bestCleanStreak: 0,
  settings: { music: 1, sfx: 1, haptics: true, hand: 'right', quality: 1 },
  seenIntro: false,
  playTime: 0,
};

function today() {
  return new Date().toISOString().slice(0, 10);
}

class SaveManager {
  constructor() {
    this.data = this.load();
    this.dirty = false;
    this.flushTimer = null;
  }

  read() {
    try { return localStorage.getItem(KEY) ?? this.mem ?? null; } catch { return this.mem ?? null; }
  }

  write(str) {
    // Repli en mémoire : navigation privée, iframe cloisonnée, quota plein…
    // La progression survit alors au moins à la session en cours, au lieu de
    // s'évaporer à chaque niveau terminé.
    this.mem = str;
    try { localStorage.setItem(KEY, str); } catch { /* stockage indisponible */ }
  }

  load() {
    const raw = this.read();
    if (!raw) return structuredClone(DEFAULTS);
    try {
      const parsed = JSON.parse(raw);
      // Fusion défensive : un champ manquant reprend sa valeur par défaut.
      return {
        ...structuredClone(DEFAULTS),
        ...parsed,
        settings: { ...DEFAULTS.settings, ...(parsed.settings || {}) },
        levels: parsed.levels || {},
      };
    } catch {
      return structuredClone(DEFAULTS);
    }
  }

  /** Écriture différée : on n'écrit jamais localStorage en plein niveau. */
  save() {
    this.dirty = true;
    if (this.flushTimer) return;
    this.flushTimer = setTimeout(() => {
      this.flushTimer = null;
      if (!this.dirty) return;
      this.dirty = false;
      this.write(JSON.stringify(this.data));
    }, 400);
  }

  flush() {
    if (this.flushTimer) { clearTimeout(this.flushTimer); this.flushTimer = null; }
    this.write(JSON.stringify(this.data));
    this.dirty = false;
  }

  // --- Accès niveau ----------------------------------------------------------

  level(num) {
    const k = String(num);
    if (!this.data.levels[k]) this.data.levels[k] = { done: false, deaths: 0, best: null, secret: false };
    return this.data.levels[k];
  }

  addDeath(num) {
    const l = this.level(num);
    l.deaths++;
    this.data.totalDeaths++;
    const d = today();
    this.data.deathsByDay[d] = (this.data.deathsByDay[d] || 0) + 1;
    this.data.cleanStreak = 0;
    this.save();
  }

  complete(num, time, deathsThisRun) {
    const l = this.level(num);
    const first = !l.done;
    l.done = true;
    if (l.best == null || time < l.best) l.best = time;
    if (deathsThisRun === 0) {
      this.data.cleanStreak++;
      this.data.bestCleanStreak = Math.max(this.data.bestCleanStreak, this.data.cleanStreak);
    } else {
      this.data.cleanStreak = 0;
    }
    this.save();
    return first;
  }

  markSecret(num) {
    const l = this.level(num);
    if (l.secret) return false;
    l.secret = true;
    this.save();
    return true;
  }

  unlock(skinId) {
    if (this.data.unlocked.includes(skinId)) return false;
    this.data.unlocked.push(skinId);
    this.save();
    return true;
  }

  // --- Statistiques agrégées ---------------------------------------------------

  stats(levelCount) {
    const lv = Object.entries(this.data.levels);
    const completed = lv.filter(([, v]) => v.done);
    const times = completed.map(([, v]) => v.best).filter((t) => t != null);
    const chapterOfNum = (n) => Math.ceil(n / 6);
    return {
      totalDeaths: this.data.totalDeaths,
      deathsToday: this.data.deathsByDay[today()] || 0,
      completedCount: completed.length,
      levelCount,
      secrets: lv.filter(([, v]) => v.secret).length,
      bestTimeAny: times.length ? Math.min(...times) : 0,
      totalTime: times.reduce((a, b) => a + b, 0),
      bestCleanStreak: this.data.bestCleanStreak,
      maxChapter: completed.length
        ? Math.max(...completed.map(([k]) => chapterOfNum(Number(k))))
        : 1,
      worstLevel: lv.slice().sort((a, b) => b[1].deaths - a[1].deaths)[0] || null,
      playTime: this.data.playTime,
    };
  }

  /** Progression : le plus haut niveau jouable (les suivants sont verrouillés). */
  maxUnlockedLevel(levelCount) {
    let n = 1;
    while (n < levelCount && this.data.levels[String(n)]?.done) n++;
    return n;
  }

  reset() {
    this.data = structuredClone(DEFAULTS);
    this.flush();
  }
}

/* ── src/core/Audio.js ───────────────────────────────────────────── */
/**
 * Identité sonore — 100 % synthétisée à l'exécution (Web Audio).
 *
 * Choix technique : aucun fichier audio. Trois raisons, toutes décisives sur
 * mobile — poids nul (pas de 3 Mo de MP3 à télécharger), latence nulle (aucun
 * décodage, aucun buffer à charger avant le premier essai), et zéro risque de
 * réutiliser par accident un son existant.
 *
 * Le langage sonore est court et constant :
 *   sinus doux  → le robot (saut, atterrissage) ;
 *   carré filtré→ la machine (boutons, portes, mécanismes) ;
 *   bruit blanc → le danger (laser, effondrement, explosion).
 */
class AudioManager {
  constructor() {
    this.ctx = null;
    this.master = null;
    this.musicGain = null;
    this.sfxGain = null;
    this.enabled = true;
    this.musicOn = true;
    this.started = false;
    this.step = 0;
    this.timer = null;
    this.scale = [0, 3, 5, 7, 10];
    this.root = 55; // La grave
  }

  /** Doit être appelé depuis un geste utilisateur (règle des navigateurs). */
  unlock() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) { this.enabled = false; return; }
    this.ctx = new AC();
    this.master = this.ctx.createGain();
    this.master.gain.value = 0.9;
    this.master.connect(this.ctx.destination);
    this.musicGain = this.ctx.createGain();
    this.musicGain.gain.value = 0.32;
    this.musicGain.connect(this.master);
    this.sfxGain = this.ctx.createGain();
    this.sfxGain.gain.value = 0.7;
    this.sfxGain.connect(this.master);
  }

  setVolumes({ music, sfx }) {
    this.musicOn = music > 0;
    if (this.musicGain) this.musicGain.gain.value = 0.32 * music;
    if (this.sfxGain) this.sfxGain.gain.value = 0.7 * sfx;
  }

  // --- Briques de synthèse ---------------------------------------------------

  tone(freq, dur, type = 'sine', vol = 0.3, dest = null, slideTo = null) {
    if (!this.ctx || !this.enabled) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t + dur);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(dest || this.sfxGain);
    o.start(t);
    o.stop(t + dur + 0.02);
  }

  noise(dur, vol = 0.3, freq = 1200, q = 1, type = 'lowpass') {
    if (!this.ctx || !this.enabled) return;
    const t = this.ctx.currentTime;
    const n = Math.floor(this.ctx.sampleRate * dur);
    const buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = this.ctx.createBufferSource();
    src.buffer = buf;
    const f = this.ctx.createBiquadFilter();
    f.type = type;
    f.frequency.value = freq;
    f.Q.value = q;
    const g = this.ctx.createGain();
    g.gain.value = vol;
    src.connect(f).connect(g).connect(this.sfxGain);
    src.start(t);
  }

  // --- Vocabulaire du jeu ----------------------------------------------------

  play(name) {
    if (!this.ctx || !this.enabled) return;
    switch (name) {
      case 'jump': this.tone(430, 0.12, 'sine', 0.22, null, 660); break;
      case 'land': this.tone(150, 0.09, 'sine', 0.18, null, 90); break;
      case 'dash': this.tone(880, 0.14, 'sawtooth', 0.14, null, 300); this.noise(0.12, 0.1, 2400); break;
      case 'click': this.tone(720, 0.05, 'square', 0.14); this.tone(1080, 0.06, 'square', 0.07); break;
      case 'unclick': this.tone(380, 0.06, 'square', 0.1); break;
      case 'mech': this.tone(120, 0.22, 'square', 0.1, null, 180); break;
      case 'door': this.tone(90, 0.3, 'square', 0.12, null, 150); this.noise(0.25, 0.06, 700); break;
      case 'laser': this.tone(1400, 0.16, 'sawtooth', 0.1, null, 900); this.noise(0.14, 0.08, 3000, 3, 'bandpass'); break;
      case 'creak': this.noise(0.3, 0.12, 500, 2, 'bandpass'); break;
      case 'crumble': this.noise(0.45, 0.22, 380); this.tone(70, 0.3, 'square', 0.1, null, 40); break;
      case 'slam': this.noise(0.2, 0.3, 220); this.tone(60, 0.25, 'square', 0.22, null, 35); break;
      case 'alarm': this.tone(880, 0.08, 'square', 0.09); setTimeout(() => this.tone(660, 0.08, 'square', 0.09), 90); break;
      case 'warp': this.tone(200, 0.28, 'sine', 0.16, null, 1600); break;
      case 'gravity': this.tone(300, 0.35, 'triangle', 0.18, null, 120); break;
      case 'checkpoint': this.tone(660, 0.1, 'sine', 0.18); setTimeout(() => this.tone(990, 0.16, 'sine', 0.16), 90); break;
      case 'secret':
        [660, 880, 1320].forEach((f, i) => setTimeout(() => this.tone(f, 0.18, 'triangle', 0.18), i * 90));
        break;
      case 'death':
        // Le fameux « effet cartoon court » : une descente rapide + un souffle.
        this.tone(500, 0.22, 'square', 0.2, null, 60);
        this.noise(0.28, 0.28, 900);
        break;
      case 'win':
        [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => this.tone(f, 0.22, 'triangle', 0.2), i * 85));
        break;
      case 'ui': this.tone(560, 0.05, 'sine', 0.12); break;
      case 'unlock':
        [392, 523, 659, 880].forEach((f, i) => setTimeout(() => this.tone(f, 0.3, 'sine', 0.16), i * 110));
        break;
      default: break;
    }
  }

  // --- Musique ---------------------------------------------------------------

  /**
   * Séquenceur minimal : une nappe tenue + un arpège sur pentatonique mineure.
   * Calme, un peu inquiétant, jamais mélodique au point de fatiguer après la
   * quarantième mort dans la même salle.
   */
  startMusic(chapterId = 1) {
    if (!this.ctx || !this.musicOn || this.started) return;
    this.started = true;
    this.root = [55, 58.3, 49, 65.4, 43.7][(chapterId - 1) % 5];
    const pad = this.ctx.createOscillator();
    const padG = this.ctx.createGain();
    const filt = this.ctx.createBiquadFilter();
    filt.type = 'lowpass';
    filt.frequency.value = 420;
    pad.type = 'sawtooth';
    pad.frequency.value = this.root;
    padG.gain.value = 0.08;
    pad.connect(filt).connect(padG).connect(this.musicGain);
    pad.start();
    this.pad = pad;

    const beat = 0.32;
    this.timer = setInterval(() => {
      if (!this.musicOn) return;
      const s = this.step++;
      if (s % 2 === 0) {
        const deg = this.scale[(Math.floor(s / 2) * 3) % this.scale.length];
        const oct = 4 + ((Math.floor(s / 8)) % 2);
        const f = this.root * Math.pow(2, oct + deg / 12);
        this.tone(f, 0.5, 'triangle', 0.05, this.musicGain);
      }
      if (s % 8 === 0) this.tone(this.root * 2, 0.6, 'sine', 0.06, this.musicGain);
    }, beat * 1000);
  }

  stopMusic() {
    if (this.timer) clearInterval(this.timer);
    this.timer = null;
    if (this.pad) { try { this.pad.stop(); } catch { /* déjà arrêté */ } this.pad = null; }
    this.started = false;
  }

  /** Assourdit la musique pendant les menus / écrans de victoire. */
  duck(on) {
    if (!this.musicGain || !this.ctx) return;
    const t = this.ctx.currentTime;
    this.musicGain.gain.cancelScheduledValues(t);
    this.musicGain.gain.linearRampToValueAtTime(on ? 0.12 : 0.32, t + 0.25);
  }
}

/* ── src/core/Haptics.js ─────────────────────────────────────────── */
/**
 * Retour haptique.
 *
 * Volontairement pauvre : quatre motifs, pas un de plus. Une vibration à
 * chaque évènement transforme le téléphone en jouet cassé et vide la batterie.
 * On vibre pour la mort, l'impact lourd, la réussite et le mécanisme majeur —
 * c'est-à-dire pour ce que le joueur doit sentir même en jouant sans le son.
 */
const PATTERNS = {
  death: [18, 30, 45],
  impact: [12],
  win: [10, 40, 10, 40, 60],
  mech: [8],
};

class Haptics {
  constructor() {
    this.enabled = true;
    this.ok = typeof navigator !== 'undefined' && 'vibrate' in navigator;
    this.last = 0;
  }

  fire(kind) {
    if (!this.enabled || !this.ok) return;
    const p = PATTERNS[kind];
    if (!p) return;
    // Anti-spam : jamais deux vibrations à moins de 60 ms.
    const now = Date.now();
    if (now - this.last < 60) return;
    this.last = now;
    try { navigator.vibrate(p); } catch { /* refusé par la plateforme */ }
  }
}

/* ── src/core/Input.js ───────────────────────────────────────────── */
/**
 * Entrées : tactile, clavier, manette.
 *
 * Deux principes qui décident de tout le reste :
 *
 * 1. Les boutons tactiles sont des éléments DOM, pas des zones dessinées sur
 *    le canvas. Le navigateur gère alors nativement le multi-touch, les zones
 *    de frappe et l'accessibilité — et surtout on peut agrandir la surface
 *    tactile bien au-delà du visuel, ce qui est LA clé du confort au pouce.
 *
 * 2. L'appui de saut est mis en file d'attente, jamais lu « à l'instant T ».
 *    Un appui de 30 ms entre deux pas de simulation doit être entendu : sinon
 *    le joueur jure qu'il a appuyé, et il a raison.
 */
class Input {
  constructor(root) {
    this.state = { left: false, right: false, jump: false, dash: false };
    this.jumpQueued = false;
    this.dashQueued = false;
    this.pointers = new Map();
    this.padIndex = null;
    this.padPrev = { jump: false, dash: false };
    this.onAnyInput = null;
    this.bindKeyboard();
    if (root) this.bindTouch(root);
    this.bindPad();
  }

  press(key, down) {
    if (down && this.onAnyInput) this.onAnyInput();
    if (key === 'jump') {
      if (down && !this.state.jump) this.jumpQueued = true;
      this.state.jump = down;
    } else if (key === 'dash') {
      if (down && !this.state.dash) this.dashQueued = true;
      this.state.dash = down;
    } else {
      this.state[key] = down;
    }
  }

  bindKeyboard() {
    const map = {
      ArrowLeft: 'left', KeyA: 'left', KeyQ: 'left',
      ArrowRight: 'right', KeyD: 'right',
      ArrowUp: 'jump', Space: 'jump', KeyW: 'jump', KeyZ: 'jump',
      ShiftLeft: 'dash', ShiftRight: 'dash', KeyX: 'dash',
    };
    addEventListener('keydown', (e) => {
      const k = map[e.code];
      if (!k) return;
      if (!e.repeat) this.press(k, true);
      e.preventDefault();
    });
    addEventListener('keyup', (e) => {
      const k = map[e.code];
      if (!k) return;
      this.press(k, false);
      e.preventDefault();
    });
    // Perdre le focus ne doit jamais laisser une touche « collée ».
    addEventListener('blur', () => this.releaseAll());
  }

  bindTouch(root) {
    const buttons = root.querySelectorAll('[data-key]');
    for (const btn of buttons) {
      const key = btn.dataset.key;
      const down = (e) => {
        e.preventDefault();
        this.pointers.set(e.pointerId, key);
        btn.classList.add('is-down');
        this.press(key, true);
        try { btn.setPointerCapture(e.pointerId); } catch { /* non capturable */ }
      };
      const up = (e) => {
        e.preventDefault();
        this.pointers.delete(e.pointerId);
        btn.classList.remove('is-down');
        this.press(key, false);
      };
      btn.addEventListener('pointerdown', down);
      btn.addEventListener('pointerup', up);
      btn.addEventListener('pointercancel', up);
      btn.addEventListener('pointerleave', (e) => {
        // Glisser hors du bouton relâche : évite les touches fantômes.
        if (this.pointers.has(e.pointerId)) up(e);
      });
      btn.addEventListener('contextmenu', (e) => e.preventDefault());
    }
  }

  bindPad() {
    addEventListener('gamepadconnected', (e) => { this.padIndex = e.gamepad.index; });
    addEventListener('gamepaddisconnected', () => { this.padIndex = null; });
  }

  /** Lecture manette, appelée une fois par frame. */
  pollPad() {
    if (this.padIndex == null || !navigator.getGamepads) return;
    const gp = navigator.getGamepads()[this.padIndex];
    if (!gp) return;
    const ax = gp.axes[0] ?? 0;
    const dpadL = gp.buttons[14]?.pressed;
    const dpadR = gp.buttons[15]?.pressed;
    this.state.left = dpadL || ax < -0.35;
    this.state.right = dpadR || ax > 0.35;
    const jump = gp.buttons[0]?.pressed || gp.buttons[1]?.pressed;
    const dash = gp.buttons[2]?.pressed || gp.buttons[7]?.pressed;
    if (jump && !this.padPrev.jump) this.jumpQueued = true;
    if (dash && !this.padPrev.dash) this.dashQueued = true;
    this.state.jump = jump || this.state.jump;
    this.state.dash = dash || this.state.dash;
    this.padPrev.jump = jump;
    this.padPrev.dash = dash;
  }

  /**
   * Snapshot pour UN pas de simulation. Les fronts montants ne sont servis
   * qu'une seule fois — c'est ce qui empêche un appui d'être compté deux fois
   * quand la frame contient plusieurs pas fixes.
   */
  consume() {
    const s = {
      left: this.state.left,
      right: this.state.right,
      jump: this.state.jump,
      jumpPressed: this.jumpQueued,
      dashPressed: this.dashQueued,
    };
    this.jumpQueued = false;
    this.dashQueued = false;
    return s;
  }

  releaseAll() {
    this.state.left = this.state.right = this.state.jump = this.state.dash = false;
    this.jumpQueued = this.dashQueued = false;
    for (const el of document.querySelectorAll('[data-key].is-down')) el.classList.remove('is-down');
  }
}

/* ── src/core/Achievements.js ────────────────────────────────────── */
/**
 * Accomplissements.
 *
 * Ils ne servent qu'à débloquer des robots, et ils sont conçus pour récompenser
 * DEUX profils opposés : celui qui persévère (100 morts, 500 morts) et celui
 * qui maîtrise (un niveau sous 10 s, cinq sans mourir). Un joueur qui échoue
 * beaucoup doit débloquer des choses lui aussi — sinon le jeu punit deux fois.
 */
const ACHIEVEMENTS = [
  { id: 'first', name: 'Premier pas', desc: 'Terminer un niveau.', test: (s) => s.completedCount >= 1 },
  { id: 'd100', name: 'Persévérant', desc: '100 morts au total.', test: (s) => s.totalDeaths >= 100 },
  { id: 'd500', name: 'Increvable', desc: '500 morts au total.', test: (s) => s.totalDeaths >= 500 },
  { id: 'clean5', name: 'Sans une éraflure', desc: '5 niveaux d\'affilée sans mourir.', test: (s) => s.bestCleanStreak >= 5 },
  { id: 'fast10', name: 'Expéditif', desc: 'Un niveau en moins de 10 secondes.', test: (s) => s.bestTimeAny > 0 && s.bestTimeAny < 10 },
  { id: 'secret1', name: 'Curieux', desc: 'Trouver une salle secrète.', test: (s) => s.secrets >= 1 },
  { id: 'secret3', name: 'Fouineur', desc: 'Trouver les 3 salles secrètes.', test: (s) => s.secrets >= 3 },
  { id: 'ch2', name: 'Sortie de secteur', desc: 'Atteindre le laboratoire.', test: (s) => s.maxChapter >= 2 },
  { id: 'ch5', name: 'Zone interdite', desc: 'Atteindre le secteur interdit.', test: (s) => s.maxChapter >= 5 },
  { id: 'all', name: 'Extraction complète', desc: 'Terminer les 30 salles.', test: (s) => s.completedCount >= s.levelCount },
];

class AchievementManager {
  constructor(save) {
    this.save = save;
  }

  /**
   * Réévalue tout à chaque appel (c'est trivialement rapide) et renvoie la
   * liste des nouveautés — accomplissements ET robots — pour que l'UI les
   * annonce sans que le reste du code ait à s'en occuper.
   */
  check(levelCount) {
    const stats = this.save.stats(levelCount);
    const news = [];

    for (const a of ACHIEVEMENTS) {
      if (this.save.data.achievements.includes(a.id)) continue;
      if (a.test(stats)) {
        this.save.data.achievements.push(a.id);
        news.push({ kind: 'achievement', id: a.id, name: a.name, desc: a.desc });
      }
    }
    for (const skin of SKINS) {
      if (this.save.data.unlocked.includes(skin.id)) continue;
      if (isSkinUnlocked(skin, stats)) {
        this.save.data.unlocked.push(skin.id);
        news.push({ kind: 'skin', id: skin.id, name: skin.name, desc: skin.unlock?.label || '' });
      }
    }
    if (news.length) this.save.save();
    return news;
  }

  earned() {
    return ACHIEVEMENTS.map((a) => ({
      ...a, done: this.save.data.achievements.includes(a.id),
    }));
  }
}

/* ── src/main.js ─────────────────────────────────────────────────── */
/**
 * Point d'entrée.
 *
 * Ordre volontaire : sauvegarde → services → jeu → interface. L'audio n'est
 * jamais initialisé ici — les navigateurs mobiles exigent un geste utilisateur,
 * et forcer un contexte audio au chargement coûte du temps de démarrage pour
 * rien. Il se déverrouille au premier appui, où qu'il soit.
 */

const canvas = document.getElementById('game');
const save = new SaveManager();
const audio = new AudioManager();
const haptics = new Haptics();
const input = new Input(document.getElementById('touch'));
const achievements = new AchievementManager(save);

const game = new Game(canvas, { save, audio, haptics, input, achievements });
const ui = new UIManager(game);

input.onAnyInput = () => audio.unlock();
addEventListener('pointerdown', () => audio.unlock(), { once: true });

// Sauvegarde garantie avant fermeture ou passage en arrière-plan.
addEventListener('pagehide', () => save.flush());
document.addEventListener('visibilitychange', () => { if (document.hidden) save.flush(); });

// Le double-tap zoom d'iOS ruine un jeu d'action : on le neutralise.
document.addEventListener('dblclick', (e) => e.preventDefault(), { passive: false });
document.addEventListener('gesturestart', (e) => e.preventDefault());

// Utile pour tester une salle précise : index.html#12
const deep = Number(location.hash.replace('#', ''));
if (deep >= 1 && deep <= 30) {
  audio.unlock();
  game.startLevel(deep);
  ui.showScreen(null);
}


// Exposé pour le débogage manuel depuis la console (jamais utilisé par le jeu).
window.VOID = { game, ui, save };
</script>
